<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://upload.wikimedia.org https://*.tile.openstreetmap.org https://tile.openstreetmap.org; connect-src 'self' https://hu.wikipedia.org https://en.wikipedia.org; object-src 'none'; base-uri 'self'">
<meta name="theme-color" content="#0a0f1a">
<title>Világ Rejtélyei</title>
<link rel="stylesheet" href="lib/leaflet.css">
<style>
:root { --bg: #0a0f1a; --card: #121a28; --card2: #1a2432; --text: #e8eef6; --muted: #8696a8; --line: #273344; --accent: #38bdf8; --new: #f0b429; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body { background: var(--bg); color: var(--text); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
#map { position: absolute; inset: 0; background: #0a0f1a; }
.leaflet-container { background: #0a1020; font: inherit; }
header { position: absolute; top: 0; left: 0; right: 0; z-index: 500; padding: calc(10px + env(safe-area-inset-top)) 12px 10px; display: flex; gap: 8px; align-items: center; background: linear-gradient(#0a0f1aee, #0a0f1a00); pointer-events: none; }
header > * { pointer-events: auto; }
header .title { font-weight: 800; font-size: 17px; flex: 1; text-shadow: 0 1px 4px #000; }
header .title b { color: var(--accent); }
header button { background: #121a28dd; border: 1px solid var(--line); color: var(--text); border-radius: 10px; width: 42px; height: 42px; font-size: 18px; cursor: pointer; backdrop-filter: blur(4px); }
.pin { border-radius: 50%; border: 2px solid #0a0f1a; box-shadow: 0 1px 4px #000a; display: grid; place-items: center; font-size: 15px; }
body.sheet-open .tabs { display: none; }
.tabs { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom)); z-index: 500; display: flex; gap: 4px; background: #121a28ee; border: 1px solid var(--line); border-radius: 14px; padding: 4px; backdrop-filter: blur(6px); }
.tabs button { background: none; border: 0; color: var(--muted); font: inherit; font-weight: 700; padding: 8px 14px; border-radius: 10px; cursor: pointer; font-size: 14px; }
.tabs button.on { background: var(--accent); color: #041018; }
/* alsó lap (hely részletei) */
.sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 900; background: var(--card); border-radius: 20px 20px 0 0; box-shadow: 0 -8px 40px #000a; transform: translateY(110%); transition: transform .28s cubic-bezier(.2,.8,.2,1); max-height: 86%; display: flex; flex-direction: column; }
.sheet.open { transform: none; }
.sheet .grab { width: 44px; height: 5px; background: var(--line); border-radius: 99px; margin: 8px auto 4px; flex: none; }
.sheet .scroll { overflow-y: auto; padding: 4px 16px calc(18px + env(safe-area-inset-bottom)); }
.sheet .hero { width: calc(100% + 32px); margin: 0 -16px 10px; height: 200px; object-fit: cover; background: var(--card2); display: block; }
.sheet h2 { margin: 2px 0 6px; font-size: 22px; }
.chip { display: inline-flex; align-items: center; gap: 5px; background: var(--card2); border: 1px solid var(--line); border-radius: 99px; padding: 3px 10px; font-size: 12px; font-weight: 700; }
.teaser { color: #cdd9e6; font-size: 15px; margin: 10px 0; font-style: italic; }
.desc { color: #dbe4ee; font-size: 15px; white-space: pre-wrap; }
.sheet .acts { display: flex; gap: 8px; margin: 14px 0 2px; }
.sheet .acts button { flex: 1; min-width: 0; font: inherit; font-weight: 800; border-radius: 12px; padding: 13px 6px; cursor: pointer; background: var(--card2); color: var(--text); border: 1px solid var(--line); white-space: nowrap; }
.sheet .acts .fav.on { background: #3a1f2a; border-color: #f472b6; color: #f9a8d4; }
.sheet .acts .next { background: var(--accent); color: #041018; border-color: var(--accent); }
.loading { color: var(--muted); font-size: 14px; padding: 8px 0; }
.wlink { color: var(--accent); font-size: 13px; text-decoration: none; display: inline-block; margin-top: 8px; }
.note { color: var(--muted); font-size: 12px; margin-top: 8px; }
/* lista nézet (kedvencek / előzmények) */
.panel { position: absolute; inset: 0; top: 0; z-index: 800; background: var(--bg); transform: translateX(100%); transition: transform .25s; display: flex; flex-direction: column; }
.panel.open { transform: none; }
.panel .phead { padding: calc(12px + env(safe-area-inset-top)) 16px 10px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--line); }
.panel .phead h2 { margin: 0; font-size: 18px; flex: 1; }
.panel .plist { overflow-y: auto; padding: 12px 16px calc(80px + env(safe-area-inset-bottom)); }
.row { display: flex; gap: 12px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px; margin-bottom: 10px; cursor: pointer; }
.row .ic { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; font-size: 20px; flex: none; }
.row .m { flex: 1; min-width: 0; }
.row .m b { display: block; }
.row .m span { color: var(--muted); font-size: 13px; }
.back { background: none; border: 0; color: var(--text); font: inherit; font-size: 22px; cursor: pointer; }
.empty { text-align: center; color: var(--muted); padding: 50px 20px; }
.empty .big { font-size: 46px; margin-bottom: 10px; }
/* kategória-szűrő */
.filters { position: absolute; top: calc(62px + env(safe-area-inset-top)); left: 0; right: 0; z-index: 480; display: flex; gap: 6px; overflow-x: auto; padding: 0 12px 6px; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.filters .f { flex: none; background: #121a28dd; border: 1px solid var(--line); color: var(--text); border-radius: 99px; padding: 6px 12px; font-size: 13px; font-weight: 700; cursor: pointer; backdrop-filter: blur(4px); }
.filters .f.off { opacity: .4; }
.toast { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(72px + env(safe-area-inset-bottom)); z-index: 950; background: #0a0f1a; border: 1px solid var(--accent); padding: 9px 15px; border-radius: 10px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.show { opacity: 1; }
</style>
</head>
<body>
<div id="map"></div>
<header>
  <div class="title">Világ <b>Rejtélyei</b></div>
  <button id="randomBtn" title="Véletlen hely">🎲</button>
</header>
<div class="filters" id="filters"></div>

<div class="tabs">
  <button data-tab="map" class="on">🗺️ Térkép</button>
  <button data-tab="fav">❤️ Kedvencek</button>
  <button data-tab="hist">🕘 Előzmények</button>
</div>

<div class="sheet" id="sheet">
  <div class="grab"></div>
  <div class="scroll" id="sheetBody"></div>
</div>

<div class="panel" id="panel">
  <div class="phead"><button class="back" id="panelBack">‹</button><h2 id="panelTitle"></h2></div>
  <div class="plist" id="panelList"></div>
</div>

<div id="toast" class="toast"></div>

<script src="lib/leaflet.js"></script>
<script src="data.js"></script>
<script>
'use strict';
const $ = s => document.querySelector(s);
const K = window.KATEGORIAK, HELYEK = window.HELYEK;
const byId = Object.fromEntries(HELYEK.map(h => [h.id, h]));
let activeCats = new Set(Object.keys(K));
let current = null;

function load(k, def) { try { const v = localStorage.getItem(k); return v == null ? def : JSON.parse(v); } catch { return def; } }
function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
let favs = load('vf_favs', []);              // id lista
let hist = load('vf_hist', []);              // {id, t}
let wikicache = load('vf_wiki', {});         // { id: {extract, img, url, lang, at} }
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), 1900); }
function esc(s) { return String(s ?? '').replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }

// ---------- térkép ----------
const map = L.map('map', { zoomControl: false, attributionControl: false, worldCopyJump: true, minZoom: 2, maxZoom: 12 }).setView([25, 10], 2.4);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, crossOrigin: true }).addTo(map);
L.control.attribution({ prefix: false, position: 'bottomright' }).addAttribution('© OpenStreetMap').addTo(map);
const markers = {};
function makeIcon(kat) {
  const c = K[kat];
  return L.divIcon({ className: '', html: `<div class="pin" style="width:30px;height:30px;background:${c.szin}">${c.emoji}</div>`, iconSize: [30, 30], iconAnchor: [15, 15] });
}
HELYEK.forEach(h => {
  const m = L.marker([h.lat, h.lon], { icon: makeIcon(h.kat) }).addTo(map);
  m.on('click', () => openPlace(h.id));
  markers[h.id] = m;
});
function applyFilter() {
  HELYEK.forEach(h => {
    const on = activeCats.has(h.kat);
    const el = markers[h.id].getElement();
    if (el) el.style.display = on ? '' : 'none';
  });
}

function renderFilters() {
  $('#filters').innerHTML = Object.entries(K).map(([id, c]) =>
    `<button class="f ${activeCats.has(id) ? '' : 'off'}" data-f="${id}" style="border-color:${c.szin}66">${c.emoji} ${c.nev}</button>`).join('');
  $('#filters').querySelectorAll('[data-f]').forEach(b => b.onclick = () => {
    const id = b.dataset.f;
    if (activeCats.has(id)) activeCats.delete(id); else activeCats.add(id);
    if (!activeCats.size) activeCats = new Set(Object.keys(K));
    renderFilters(); applyFilter();
  });
}

// ---------- Wikipédia ----------
async function getJson(url) {
  const Cap = window.Capacitor;
  if (Cap && Cap.Plugins && Cap.Plugins.CapacitorHttp) {
    const r = await Cap.Plugins.CapacitorHttp.get({ url, readTimeout: 12000, connectTimeout: 12000 });
    if (r.status >= 400) throw new Error('HTTP ' + r.status);
    return typeof r.data === 'string' ? JSON.parse(r.data) : r.data;
  }
  const r = await fetch(url);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
async function summary(lang, title) {
  const d = await getJson(`https://${lang}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title)}`);
  if (!d || d.type === 'https://mediawiki.org/wiki/HyperSwitch/errors/not_found' || !d.extract) throw new Error('nincs');
  return { extract: d.extract, img: (d.thumbnail && d.thumbnail.source) || (d.originalimage && d.originalimage.source) || '', url: d.content_urls && d.content_urls.desktop && d.content_urls.desktop.page, lang };
}
async function fetchWiki(h) {
  if (wikicache[h.id] && Date.now() - wikicache[h.id].at < 30 * 864e5) return wikicache[h.id];
  let res = null;
  if (h.wiki.hu) { try { res = await summary('hu', h.wiki.hu); } catch {} }
  if (!res && h.wiki.en) { try { res = await summary('en', h.wiki.en); } catch {} }
  if (!res) throw new Error('A Wikipédián nem találom ezt a cikket.');
  wikicache[h.id] = { ...res, at: Date.now() };
  save('vf_wiki', wikicache);
  return wikicache[h.id];
}

// ---------- hely megnyitása ----------
function addHist(id) {
  hist = hist.filter(x => x.id !== id);
  hist.unshift({ id, t: Date.now() });
  hist = hist.slice(0, 60);
  save('vf_hist', hist);
}
function related(h) {
  const same = HELYEK.filter(x => x.id !== h.id && x.kat === h.kat);
  const pool = same.length ? same : HELYEK.filter(x => x.id !== h.id);
  return pool[Math.floor(Math.random() * pool.length)];
}
async function openPlace(id, fly = true) {
  const h = byId[id]; if (!h) return;
  current = h;
  addHist(id);
  const c = K[h.kat];
  if (fly) map.flyTo([h.lat, h.lon], Math.max(map.getZoom(), 5), { duration: 0.8 });
  const isFav = favs.includes(id);
  $('#sheetBody').innerHTML = `
    <div id="heroWrap"></div>
    <h2>${esc(h.nev)}</h2>
    <span class="chip" style="border-color:${c.szin}">${c.emoji} ${esc(c.nev)}</span>
    <p class="teaser">„${esc(h.teaser)}”</p>
    <div id="descBox" class="loading">📖 Leírás betöltése a Wikipédiából…</div>
    <div class="acts">
      <button class="fav ${isFav ? 'on' : ''}" id="favBtn">${isFav ? '❤️' : '🤍'} Mentés</button>
      <button id="relBtn">🧭 Hasonló</button>
      <button class="next" id="nextBtn">🎲 Új</button>
    </div>`;
  $('#sheet').classList.add('open'); document.body.classList.add('sheet-open');
  $('#favBtn').onclick = () => toggleFav(id);
  $('#relBtn').onclick = () => openPlace(related(h).id);
  $('#nextBtn').onclick = () => randomPlace();
  try {
    const w = await fetchWiki(h);
    if (current !== h) return;
    $('#heroWrap').innerHTML = w.img ? `<img class="hero" src="${esc(w.img)}" alt="" onerror="this.remove()">` : '';
    $('#descBox').outerHTML = `<div class="desc">${esc(w.extract)}</div>
      ${w.lang === 'en' ? '<div class="note">(A magyar szócikk nem elérhető, ezért angolul.)</div>' : ''}
      ${w.url ? `<a class="wlink" href="${esc(w.url)}" target="_blank" rel="noopener">Tovább a Wikipédián ↗</a>` : ''}`;
  } catch (e) {
    if (current === h) $('#descBox').outerHTML = `<div class="note">⚠️ ${esc(e.message)} Van internet? A teaser fent olvasható.</div>`;
  }
}
function closeSheet() { $('#sheet').classList.remove('open'); document.body.classList.remove('sheet-open'); current = null; }
function toggleFav(id) {
  if (favs.includes(id)) { favs = favs.filter(x => x !== id); toast('💔 Kivéve a kedvencekből'); }
  else { favs.unshift(id); toast('❤️ Kedvencekhez adva'); }
  save('vf_favs', favs);
  const b = $('#favBtn');
  if (b && current && current.id === id) { const on = favs.includes(id); b.className = 'fav ' + (on ? 'on' : ''); b.textContent = on ? '❤️ Mentés' : '🤍 Mentés'; }
}
function randomPlace() {
  const pool = HELYEK.filter(h => activeCats.has(h.kat) && (!current || h.id !== current.id));
  const h = (pool.length ? pool : HELYEK)[Math.floor(Math.random() * (pool.length || HELYEK.length))];
  openPlace(h.id);
}

// ---------- panelek (kedvencek / előzmények) ----------
function openPanel(kind) {
  const list = kind === 'fav' ? favs.map(id => byId[id]).filter(Boolean)
    : hist.map(x => byId[x.id]).filter(Boolean);
  $('#panelTitle').textContent = kind === 'fav' ? '❤️ Kedvencek' : '🕘 Előzmények';
  if (!list.length) {
    $('#panelList').innerHTML = `<div class="empty"><div class="big">${kind === 'fav' ? '🤍' : '🕘'}</div>${kind === 'fav' ? 'Még nincs kedvenced. Nyiss meg egy helyet, és nyomd meg a szívet!' : 'Még nincs előzményed. Fedezz fel helyeket a térképen vagy a 🎲 gombbal!'}</div>`;
  } else {
    $('#panelList').innerHTML = list.map(h => { const c = K[h.kat]; return `
      <div class="row" data-open="${h.id}">
        <div class="ic" style="background:${c.szin}">${c.emoji}</div>
        <div class="m"><b>${esc(h.nev)}</b><span>${esc(c.nev)} · ${esc(h.teaser)}</span></div>
      </div>`; }).join('');
    $('#panelList').querySelectorAll('[data-open]').forEach(r => r.onclick = () => { closePanel(); openPlace(r.dataset.open); });
  }
  $('#panel').classList.add('open');
}
function closePanel() { $('#panel').classList.remove('open'); $$tabs('map'); }
function $$tabs(name) { document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === name)); }

// ---------- események ----------
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  const t = b.dataset.tab; $$tabs(t);
  if (t === 'map') { closePanel(); }
  else openPanel(t);
});
$('#panelBack').onclick = closePanel;
$('#randomBtn').onclick = randomPlace;
$('.sheet .grab').onclick = closeSheet;
// alsó lap bezárása lefelé húzással / térképre kattintva
map.on('click', closeSheet);
let startY = null;
$('#sheet').addEventListener('touchstart', e => { startY = e.touches[0].clientY; }, { passive: true });
$('#sheet').addEventListener('touchmove', e => {
  if (startY == null) return;
  const dy = e.touches[0].clientY - startY;
  if (dy > 70 && $('#sheetBody').scrollTop <= 0) { closeSheet(); startY = null; }
}, { passive: true });

renderFilters();
applyFilter();
map.whenReady(() => setTimeout(() => map.invalidateSize(), 150));

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
