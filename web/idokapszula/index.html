<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a18">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self'; base-uri 'self'; object-src 'none'">
<title>Időkapszula</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  :root {
    --bg: #0a0a18; --bg2: #11112a; --card: #14142e; --card2: #1b1b3d; --line: #2a2a55;
    --text: #eef0ff; --muted: #9a9cc8; --gold: #f5c451; --teal: #35d0c0; --violet: #8b7bff;
    --grad: linear-gradient(135deg, #f5c451, #ff8e6e); --on-accent: #241a05; --good: #41d99a; --danger: #ff7a90;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body { background: radial-gradient(1000px 600px at 50% -15%, #1a1540 0%, var(--bg) 60%), var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding-bottom: calc(40px + env(safe-area-inset-bottom)); min-height: 100vh; }
  body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none; background-image: radial-gradient(1.5px 1.5px at 20% 30%, #fff6 50%, transparent), radial-gradient(1.5px 1.5px at 70% 20%, #fff5 50%, transparent), radial-gradient(1px 1px at 40% 70%, #fff5 50%, transparent), radial-gradient(1.5px 1.5px at 85% 60%, #fff4 50%, transparent), radial-gradient(1px 1px at 55% 45%, #fff4 50%, transparent); background-repeat: no-repeat; opacity: .5; }
  header { position: sticky; top: 0; z-index: 10; background: rgba(10,10,24,.85); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); padding: calc(10px + env(safe-area-inset-top)) 16px 10px; display: flex; align-items: center; gap: 10px; }
  header h1 { font-size: 18px; margin: 0; font-weight: 800; letter-spacing: .5px; display: flex; align-items: center; gap: 8px; }
  header .sp { flex: 1; }
  .iconbtn { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--text); display: grid; place-items: center; font-size: 18px; }
  main { padding: 16px; max-width: 720px; margin: 0 auto; }
  input, textarea, select { font: inherit; color: var(--text); background: var(--card2); border: 1px solid var(--line); border-radius: 12px; padding: 12px 13px; width: 100%; outline: none; }
  input:focus, textarea:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(245,196,81,.15); }
  textarea { resize: vertical; min-height: 120px; line-height: 1.55; }
  label.fld { display: block; margin-bottom: 14px; }
  label.fld > span { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; text-transform: uppercase; letter-spacing: .5px; }
  .btn { border: 1px solid var(--line); background: var(--card2); color: var(--text); border-radius: 12px; padding: 12px 15px; font: inherit; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 7px; }
  .btn.hot { background: var(--grad); color: var(--on-accent); border: 0; box-shadow: 0 6px 18px -6px var(--gold); }
  .btn.full { width: 100%; }
  .btn.sm { padding: 8px 12px; font-size: 13px; }
  .btn.ghost { background: transparent; }
  .btn.danger { color: var(--danger); border-color: #5a2436; }
  .muted { color: var(--muted); } .small { font-size: 13px; color: var(--muted); }
  .cap { position: relative; border: 1px solid var(--line); border-radius: 18px; padding: 16px; margin-bottom: 14px; background: var(--card); overflow: hidden; }
  .cap.ready { border-color: var(--gold); box-shadow: 0 0 0 1px rgba(245,196,81,.3), 0 10px 30px -12px rgba(245,196,81,.5); }
  .cap .ic { font-size: 30px; }
  .cap h3 { margin: 6px 0 2px; font-size: 17px; }
  .cap .to { font-size: 12px; color: var(--teal); }
  .cap .cd { font-size: 13px; color: var(--muted); margin-top: 8px; }
  .cap .cd b { color: var(--gold); font-variant-numeric: tabular-nums; }
  .cap.ready .cd b { color: var(--gold); }
  .bar { height: 6px; border-radius: 99px; background: var(--card2); overflow: hidden; border: 1px solid var(--line); margin-top: 10px; }
  .bar i { display: block; height: 100%; background: var(--grad); }
  .cap .st { position: absolute; top: 14px; right: 14px; font-size: 11px; font-weight: 800; padding: 3px 9px; border-radius: 99px; text-transform: uppercase; letter-spacing: .5px; }
  .st.sealed { background: rgba(138,123,255,.16); color: var(--violet); border: 1px solid #3a3080; }
  .st.rdy { background: var(--grad); color: var(--on-accent); }
  .st.opened { background: rgba(65,217,154,.14); color: var(--good); border: 1px solid #1f5a44; }
  .snip { font-size: 14px; color: var(--muted); margin-top: 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .fab { position: fixed; right: 18px; bottom: calc(20px + env(safe-area-inset-bottom)); height: 54px; padding: 0 20px; border-radius: 18px; border: 0; background: var(--grad); color: var(--on-accent); font-size: 16px; font-weight: 800; box-shadow: 0 8px 26px -6px var(--gold); z-index: 11; display: flex; align-items: center; gap: 8px; }
  .empty { text-align: center; color: var(--muted); padding: 50px 20px; }
  .empty .big { font-size: 50px; margin-bottom: 12px; }
  .sheet { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.65); display: none; align-items: flex-end; justify-content: center; }
  .sheet.show { display: flex; }
  .sheet .inner { background: var(--card); border: 1px solid var(--line); border-radius: 20px 20px 0 0; width: 100%; max-width: 560px; padding: 16px 16px calc(22px + env(safe-area-inset-bottom)); max-height: 92vh; overflow: auto; }
  .sheet h2 { margin: 2px 0 14px; font-size: 18px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .chip { border: 1px solid var(--line); background: var(--card2); color: var(--text); border-radius: 99px; padding: 8px 13px; font-size: 13px; font-weight: 700; }
  .chip.on { background: var(--grad); color: var(--on-accent); border: 0; }
  .media { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 8px; }
  .media .m { position: relative; aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: var(--card2); border: 1px solid var(--line); }
  .media .m img { width: 100%; height: 100%; object-fit: cover; }
  .media .m .rm { position: absolute; top: 3px; right: 3px; width: 22px; height: 22px; border-radius: 50%; border: 0; background: rgba(0,0,0,.6); color: #fff; font-size: 12px; }
  .media .add { display: grid; place-items: center; aspect-ratio: 1; border: 1.5px dashed var(--line); border-radius: 10px; color: var(--muted); font-size: 22px; background: transparent; }
  .lockbox { text-align: center; padding: 20px 10px; }
  .lockbox .lk { font-size: 60px; }
  .big-cd { font-size: 30px; font-weight: 900; color: var(--gold); font-variant-numeric: tabular-nums; margin: 6px 0; }
  .reveal img { width: 100%; border-radius: 12px; margin-top: 10px; }
  .msgbody { white-space: pre-wrap; word-break: break-word; font-size: 16px; line-height: 1.6; margin: 10px 0; }
  .toast { position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: #fff; color: #14142e; padding: 11px 18px; border-radius: 14px; font-weight: 800; font-size: 14px; z-index: 50; max-width: 88vw; text-align: center; opacity: 0; pointer-events: none; transition: opacity .2s; }
  .toast.show { opacity: 1; }
  .banner { background: var(--grad); color: var(--on-accent); border-radius: 14px; padding: 12px 14px; font-weight: 800; margin-bottom: 14px; display: flex; align-items: center; gap: 10px; }
</style>
</head>
<body>
<header>
  <h1>🕰️ Időkapszula</h1>
  <div class="sp"></div>
  <button class="iconbtn" id="setBtn" aria-label="Beállítások">⚙️</button>
</header>
<main>
  <div id="banner"></div>
  <div id="list"></div>
</main>
<button class="fab" id="fab">＋ Új kapszula</button>

<div class="sheet" id="sheet"><div class="inner" id="sheetIn"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="picFile" accept="image/*" multiple hidden>

<script>
'use strict';
const $ = id => document.getElementById(id);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => (s == null ? '' : String(s)).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const KEY = 'idokapszula-v1';

/* ---------- IndexedDB (képek) ---------- */
let _db;
function idb() { if (_db) return _db; _db = new Promise((res, rej) => { const r = indexedDB.open('idokapszula-media', 1); r.onupgradeneeded = () => { if (!r.result.objectStoreNames.contains('img')) r.result.createObjectStore('img', { keyPath: 'id' }); }; r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); return _db; }
function idbDo(mode, fn) { return idb().then(db => new Promise((res, rej) => { const t = db.transaction('img', mode), s = t.objectStore('img'); const rq = fn(s); if (rq) { rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error); } else { t.oncomplete = () => res(); t.onerror = () => rej(t.error); } })); }
const imgGet = id => idbDo('readonly', s => s.get(id));
const imgPut = o => idbDo('readwrite', s => s.put(o));
const imgDel = id => idbDo('readwrite', s => s.delete(id));
const imgAll = () => idbDo('readonly', s => s.getAll());

/* ---------- Állapot ---------- */
let S = load();
function load() { try { return Object.assign({ capsules: [] }, JSON.parse(localStorage.getItem(KEY)) || {}); } catch (e) { return { capsules: [] }; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('Nem sikerült menteni 😕'); } }
function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2200); }
const now = () => Date.now();
const DAY = 86400000;
function fmtDate(t) { return new Date(t).toLocaleDateString('hu-HU', { year: 'numeric', month: 'long', day: 'numeric' }); }
function countdown(ms) {
  const d = Math.floor(ms / DAY), h = Math.floor((ms % DAY) / 3600000), mi = Math.floor((ms % 3600000) / 60000);
  if (d > 0) return `${d} nap ${h} óra`;
  if (h > 0) return `${h} óra ${mi} perc`;
  return `${Math.max(0, mi)} perc`;
}
const isReady = c => now() >= c.openAt;

/* ---------- Lista ---------- */
function sortCaps() {
  return S.capsules.slice().sort((a, b) => {
    const ra = isReady(a) && !a.opened, rb = isReady(b) && !b.opened;       // megnyitható előre
    if (ra !== rb) return rb - ra;
    if (!!a.opened !== !!b.opened) return a.opened ? 1 : -1;                 // nyitottak hátra
    return a.openAt - b.openAt;
  });
}
function renderList() {
  const ready = S.capsules.filter(c => isReady(c) && !c.opened).length;
  $('banner').innerHTML = ready ? `<div class="banner">✨ ${ready} kapszulád megnyitható!</div>` : '';
  const caps = sortCaps();
  if (!caps.length) { $('list').innerHTML = `<div class="empty"><div class="big">🕰️</div><b>Még nincs kapszulád</b><p class="small">Írj egy üzenetet a jövőbeli énednek, zárd le egy dátumig, és csak akkor nyílik majd meg.</p></div>`; return; }
  $('list').innerHTML = caps.map(c => {
    const rdy = isReady(c), op = c.opened;
    const stat = op ? '<span class="st opened">megnyitva</span>' : rdy ? '<span class="st rdy">✨ kész</span>' : '<span class="st sealed">🔒 lezárva</span>';
    let body;
    if (op) body = `<div class="snip">${esc((c.message || '').slice(0, 120)) || '<i>(csak kép)</i>'}</div><div class="cd">Megnyitva: ${fmtDate(c.openedAt || c.openAt)}${(c.media || []).length ? ' · 🖼️ ' + c.media.length : ''}</div>`;
    else if (rdy) body = `<div class="cd"><b>Most megnyitható!</b> · lezárva ${fmtDate(c.created)}</div><button class="btn hot full" data-open="${c.id}" style="margin-top:10px">🔓 Megnyitom</button>`;
    else { const pct = Math.min(100, Math.max(0, (now() - c.created) / (c.openAt - c.created) * 100)); body = `<div class="cd">Megnyílik: <b>${fmtDate(c.openAt)}</b> · <b>${countdown(c.openAt - now())}</b> múlva</div><div class="bar"><i style="width:${pct}%"></i></div>`; }
    return `<div class="cap ${rdy && !op ? 'ready' : ''}" data-tap="${c.id}">${stat}<div class="ic">${op ? '📖' : rdy ? '🎁' : '🔒'}</div>
      <h3>${esc(c.title || 'Névtelen kapszula')}</h3><div class="to">➜ ${esc(c.to || 'A jövőbeli énemnek')}</div>${body}</div>`;
  }).join('');
  $('list').querySelectorAll('[data-open]').forEach(b => b.onclick = e => { e.stopPropagation(); openCapsule(b.dataset.open); });
  $('list').querySelectorAll('[data-tap]').forEach(el => el.onclick = () => openCapsule(el.dataset.tap));
}

/* ---------- Kapszula megnyitása / megtekintése ---------- */
async function openCapsule(id) {
  const c = S.capsules.find(x => x.id === id); if (!c) return;
  const rdy = isReady(c);
  if (!rdy && !c.opened) return showLocked(c);
  if (!c.opened) { c.opened = true; c.openedAt = now(); save(); renderList(); }
  showReveal(c);
}
function showLocked(c) {
  openSheet(`<div class="lockbox"><div class="lk">🔒</div>
    <h2 style="margin:4px 0">${esc(c.title || 'Lezárt kapszula')}</h2>
    <div class="small">➜ ${esc(c.to || 'A jövőbeli énemnek')}</div>
    <div class="big-cd">${countdown(c.openAt - now())}</div>
    <div class="small">múlva nyílik — ${fmtDate(c.openAt)}</div>
    <p class="small" style="margin-top:18px">Addig titok marad. 🤫 Türelem — megéri majd kivárni!</p>
    <button class="btn danger full" id="forceOpen" style="margin-top:8px">Mégis megnyitom most (elrontja a meglepetést)</button>
    <button class="btn ghost full" id="editCap" style="margin-top:8px">✎ Szerkesztés</button>
    <button class="btn ghost danger full" id="delCap" style="margin-top:8px">🗑️ Törlés</button></div>`);
  $('forceOpen').onclick = () => { if (confirm('Biztosan most megnyitod? Így elveszik a meglepetés.')) { c.opened = true; c.openedAt = now(); c.early = true; save(); closeSheet(true); renderList(); showReveal(c); } };
  $('editCap').onclick = () => editCapsule(c.id);
  $('delCap').onclick = () => delCapsule(c.id);
}
async function showReveal(c) {
  openSheet(`<div class="reveal"><div style="text-align:center;font-size:42px">${c.early ? '🔓' : '🎉'}</div>
    <h2 style="text-align:center;margin:4px 0 2px">${esc(c.title || 'Kapszula')}</h2>
    <div class="small" style="text-align:center">➜ ${esc(c.to || 'A jövőbeli énemnek')} · lezárva ${fmtDate(c.created)}</div>
    ${c.message ? `<div class="msgbody">${esc(c.message)}</div>` : ''}
    <div id="revMedia"></div>
    <div class="row" style="gap:8px;margin-top:14px"><button class="btn ghost full" id="editCap">✎ Szerkesztés</button><button class="btn ghost danger full" id="delCap">🗑️ Törlés</button></div></div>`);
  const mbox = $('revMedia');
  for (const mid of (c.media || [])) { const m = await imgGet(mid); if (!m) continue; const url = URL.createObjectURL(m.blob); const im = new Image(); im.src = url; im.style.width = '100%'; im.style.borderRadius = '12px'; im.style.marginTop = '10px'; mbox.appendChild(im); }
  $('editCap').onclick = () => editCapsule(c.id);
  $('delCap').onclick = () => delCapsule(c.id);
}
function delCapsule(id) {
  if (!confirm('Törlöd ezt a kapszulát?')) return;
  const c = S.capsules.find(x => x.id === id); (c && c.media || []).forEach(mid => imgDel(mid));
  S.capsules = S.capsules.filter(x => x.id !== id); save(); closeSheet(true); renderList(); toast('Törölve');
}

/* ---------- Új / szerkesztés ---------- */
const PRESETS = [['1 hét', 7], ['1 hónap', 30], ['6 hónap', 182], ['1 év', 365], ['3 év', 1095], ['5 év', 1825]];
let draft = null;
function editCapsule(id) {
  const c = id ? S.capsules.find(x => x.id === id) : null;
  draft = c ? JSON.parse(JSON.stringify(c)) : { id: uid(), title: '', message: '', to: 'A jövőbeli énemnek', created: now(), openAt: now() + 365 * DAY, media: [], opened: false, _new: true };
  openSheet(`<h2>${c ? '✎ Kapszula szerkesztése' : '🕰️ Új időkapszula'}</h2>
    <label class="fld"><span>Cím</span><input id="cTitle" value="${esc(draft.title)}" placeholder="pl. Üzenet 2027-nek"></label>
    <label class="fld"><span>Címzett</span><input id="cTo" value="${esc(draft.to)}" placeholder="A jövőbeli énemnek"></label>
    <label class="fld"><span>Üzenet</span><textarea id="cMsg" placeholder="Mit üzensz a jövőbeli énednek? Hogy érzed most magad, mik a céljaid, mire vagy büszke…">${esc(draft.message)}</textarea></label>
    <label class="fld"><span>Mikor nyíljon meg?</span><div class="chips" id="preset">${PRESETS.map(([n, d]) => `<button class="chip" data-d="${d}">${n}</button>`).join('')}</div>
      <input type="date" id="cDate" min="${new Date(now() + DAY).toISOString().slice(0, 10)}" value="${new Date(draft.openAt).toISOString().slice(0, 10)}"></label>
    <div class="small" style="margin:-8px 0 12px" id="dateInfo"></div>
    <label class="fld"><span>Képek (nem kötelező)</span><div class="media" id="dMedia"></div></label>
    <button class="btn hot full" id="cSave" style="margin-top:4px">${c ? 'Mentés' : '🔒 Lezárás és mentés'}</button>`);
  const dateInfo = () => { const at = new Date($('cDate').value + 'T12:00:00').getTime(); $('dateInfo').textContent = at > now() ? `Megnyílik: ${fmtDate(at)} (${countdown(at - now())} múlva)` : 'Válassz jövőbeli dátumot.'; };
  $('preset').querySelectorAll('[data-d]').forEach(b => b.onclick = () => { $('cDate').value = new Date(now() + (+b.dataset.d) * DAY).toISOString().slice(0, 10); dateInfo(); });
  $('cDate').onchange = dateInfo; dateInfo();
  renderDraftMedia();
  $('cSave').onclick = () => {
    const at = new Date($('cDate').value + 'T12:00:00').getTime();
    draft.title = $('cTitle').value.trim(); draft.to = $('cTo').value.trim() || 'A jövőbeli énemnek'; draft.message = $('cMsg').value;
    if (!draft.title && !draft.message.trim() && !draft.media.length) { toast('Írj egy címet vagy üzenetet'); return; }
    if (!(at > now())) { toast('Válassz jövőbeli dátumot'); return; }
    draft.openAt = at;
    const ex = S.capsules.find(x => x.id === draft.id);
    if (ex) Object.assign(ex, draft); else { delete draft._new; S.capsules.push(draft); }
    save(); closeSheet(true); renderList(); toast(ex ? 'Mentve' : 'Kapszula lezárva 🔒');
  };
}
async function renderDraftMedia() {
  const box = $('dMedia'); box.innerHTML = '';
  for (const mid of draft.media) { const m = await imgGet(mid); if (!m) continue; const url = URL.createObjectURL(m.blob); const el = document.createElement('div'); el.className = 'm'; el.innerHTML = `<img src="${url}"><button class="rm" data-rm="${mid}">✕</button>`; el.querySelector('[data-rm]').onclick = async () => { draft.media = draft.media.filter(x => x !== mid); await imgDel(mid); renderDraftMedia(); }; box.appendChild(el); }
  const add = document.createElement('button'); add.className = 'add'; add.textContent = '＋'; add.onclick = () => $('picFile').click(); box.appendChild(add);
}
$('picFile').onchange = e => {
  const files = [...e.target.files]; e.target.value = ''; if (!files.length || !draft) return;
  let done = 0;
  files.forEach(f => { if (!f.type.startsWith('image/')) { if (++done === files.length) renderDraftMedia(); return; }
    const img = new Image(), url = URL.createObjectURL(f);
    img.onload = () => { URL.revokeObjectURL(url); try { const MAX = 900, sc = Math.min(1, MAX / Math.max(img.width, img.height)), w = Math.round(img.width * sc), h = Math.round(img.height * sc); const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(img, 0, 0, w, h); c.toBlob(async b => { const id = uid(); await imgPut({ id, blob: b }); draft.media.push(id); if (++done === files.length) renderDraftMedia(); else renderDraftMedia(); }, 'image/jpeg', 0.82); } catch (err) { if (++done === files.length) renderDraftMedia(); } };
    img.onerror = () => { URL.revokeObjectURL(url); if (++done === files.length) renderDraftMedia(); };
    img.src = url;
  });
};

/* ---------- Beállítások / mentés ---------- */
function openSettings() {
  openSheet(`<h2>⚙️ Beállítások</h2>
    <p class="small">Minden a telefonodon tárolódik, offline is. A kapszulák a megadott dátumig titkosak maradnak a felületen. Alkalmanként ments fájlba, hogy semmi ne vesszen el.</p>
    <button class="btn full" id="expBtn" style="margin:12px 0 8px">💾 Mentés fájlba</button>
    <button class="btn full" id="impBtn">📥 Visszaállítás fájlból</button>
    <input type="file" id="impIn" accept="application/json,.json" hidden>
    <p class="small" style="text-align:center;margin-top:16px">Időkapszula – üzenet a jövőbeli énednek 🕰️</p>`);
  $('expBtn').onclick = exportData; $('impBtn').onclick = () => $('impIn').click(); $('impIn').onchange = importData;
}
const blobToB64 = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(b); });
async function exportData() {
  const media = []; try { for (const m of await imgAll()) media.push({ id: m.id, data: await blobToB64(m.blob) }); } catch (e) {}
  const blob = new Blob([JSON.stringify({ app: 'idokapszula', ver: 1, exported: now(), S, media })], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `idokapszula-mentes-${new Date().toISOString().slice(0, 10)}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); toast('Mentés letöltve 💾');
}
async function importData(e) {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  if (!confirm('Visszaállítod a mentést? A mostani kapszuláid mellé kerülnek.')) return;
  try { const d = JSON.parse(await f.text()); if (d.app !== 'idokapszula' || !d.S) throw new Error();
    for (const m of (d.media || [])) { if (!await imgGet(m.id)) await imgPut({ id: m.id, blob: await (await fetch(m.data)).blob() }); }
    const have = new Set(S.capsules.map(c => c.id)); for (const c of (d.S.capsules || [])) if (!have.has(c.id)) S.capsules.push(c);
    save(); closeSheet(true); renderList(); toast('Visszaállítva ✅');
  } catch (e) { toast('Nem sikerült beolvasni'); }
}

/* ---------- Sheet + navigáció ---------- */
function openSheet(html) { $('sheetIn').innerHTML = html; $('sheet').classList.add('show'); history.pushState({ sheet: 1 }, ''); }
function closeSheet(skip) { $('sheet').classList.remove('show'); if (!skip && history.state && history.state.sheet) history.back(); }
$('sheet').onclick = e => { if (e.target === $('sheet')) history.back(); };
history.replaceState({ root: 1 }, '');
addEventListener('popstate', () => { if ($('sheet').classList.contains('show')) closeSheet(true); });
$('fab').onclick = () => editCapsule(null);
$('setBtn').onclick = openSettings;

/* ---------- Indítás ---------- */
renderList();
setInterval(() => { if (!$('sheet').classList.contains('show')) renderList(); }, 60000); // visszaszámlálók frissítése
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
