<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff7a45">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kaland">
<title>Véletlen kaland</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root {
  --bg: #fff7f0;
  --card: #ffffff;
  --text: #2b2118;
  --muted: #8a7766;
  --accent: #ff7a45;
  --accent-2: #ffb547;
  --ok: #2f9e6e;
  --line: #f0e2d4;
  --shadow: 0 6px 24px rgba(120, 60, 20, .10);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1b1612;
    --card: #2a221c;
    --text: #f6ece2;
    --muted: #b09c8a;
    --line: #3b3029;
    --shadow: 0 6px 24px rgba(0, 0, 0, .35);
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  min-height: 100dvh;
  padding: env(safe-area-inset-top) 0 calc(72px + env(safe-area-inset-bottom));
}
header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px 6px;
}
header h1 { font-size: 20px; margin: 0; }
.pill {
  background: var(--card); border: 1px solid var(--line); border-radius: 999px;
  padding: 4px 12px; font-weight: 700; font-size: 14px; box-shadow: var(--shadow);
}
main { max-width: 560px; margin: 0 auto; padding: 0 16px; }
.view { display: none; }
.view.active { display: block; animation: fade .25s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: 20px;
  padding: 18px; box-shadow: var(--shadow); margin: 12px 0;
}
.level { display: flex; align-items: center; gap: 12px; }
.level .badge-big { font-size: 34px; }
.level b { display: block; }
.bar { height: 10px; background: var(--line); border-radius: 99px; overflow: hidden; margin-top: 6px; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); border-radius: 99px; transition: width .5s; }
.small { font-size: 13px; color: var(--muted); }
.big-btn {
  display: block; width: 100%; border: 0; border-radius: 24px; padding: 28px 16px;
  font-size: 22px; font-weight: 800; color: #fff; cursor: pointer;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  box-shadow: 0 10px 30px rgba(255, 122, 69, .35);
  transition: transform .1s;
}
.big-btn:active { transform: scale(.97); }
.big-btn small { display: block; font-size: 14px; font-weight: 500; opacity: .9; margin-top: 4px; }
.quest-cat { font-size: 13px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: .05em; }
.quest-text { font-size: 22px; font-weight: 750; margin: 8px 0 12px; line-height: 1.3; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.btn {
  flex: 1; min-width: 120px; border: 1px solid var(--line); background: var(--card); color: var(--text);
  border-radius: 14px; padding: 13px 14px; font-size: 16px; font-weight: 650; cursor: pointer;
}
.btn.primary { background: var(--ok); color: #fff; border-color: transparent; }
.btn:disabled { opacity: .45; }
textarea {
  width: 100%; border: 1px solid var(--line); border-radius: 12px; padding: 10px; margin: 6px 0 10px;
  background: var(--bg); color: var(--text); font: inherit; resize: vertical; min-height: 60px;
}
.photo-btn { display: flex; align-items: center; justify-content: center; gap: 8px; }
.preview { width: 100%; border-radius: 14px; margin: 6px 0; display: none; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { text-align: center; }
.stat b { font-size: 24px; display: block; }
.badges { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.bdg {
  background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px 8px;
  text-align: center; font-size: 12px; box-shadow: var(--shadow);
}
.bdg .e { font-size: 32px; display: block; }
.bdg.locked { opacity: .35; filter: grayscale(1); }
.bdg b { display: block; font-size: 13px; margin: 2px 0; }
.log-item { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-bottom: 1px solid var(--line); }
.log-item:last-child { border-bottom: 0; }
.log-item img { width: 72px; height: 72px; object-fit: cover; border-radius: 12px; flex-shrink: 0; }
.log-item .ico { width: 72px; height: 72px; border-radius: 12px; background: var(--bg); display: grid; place-items: center; font-size: 30px; flex-shrink: 0; }
.log-item p { margin: 2px 0; }
nav {
  position: fixed; left: 0; right: 0; bottom: 0; display: flex;
  background: var(--card); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom);
}
nav button {
  flex: 1; border: 0; background: none; color: var(--muted); padding: 10px 0 12px;
  font-size: 12px; font-weight: 650; cursor: pointer;
}
nav button span { display: block; font-size: 22px; }
nav button.active { color: var(--accent); }
.toast {
  position: fixed; left: 50%; top: calc(16px + env(safe-area-inset-top)); transform: translate(-50%, -150%);
  background: var(--text); color: var(--bg); padding: 12px 18px; border-radius: 16px; font-weight: 700;
  transition: transform .35s ease; z-index: 10; max-width: calc(100% - 32px); text-align: center;
}
.toast.show { transform: translate(-50%, 0); }
.done-box { text-align: center; }
.done-box .e { font-size: 54px; }
h2 { font-size: 18px; margin: 20px 0 6px; }
.confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 9; }
.confetti i { position: absolute; top: -20px; width: 10px; height: 14px; border-radius: 3px; animation: fall 1.6s ease-in forwards; }
@keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
</style>
</head>
<body>
<header>
  <h1>🎲 Véletlen kaland</h1>
  <div class="pill" id="pointsPill">0 pont</div>
</header>

<main>
  <!-- KÜLDETÉS -->
  <section class="view active" id="v-quest">
    <div class="card level">
      <div class="badge-big" id="lvlEmoji">🐣</div>
      <div style="flex:1">
        <b id="lvlName">Kezdő kalandor</b>
        <div class="small" id="lvlInfo">0 / 50 pont a következő szintig</div>
        <div class="bar"><i id="lvlBar" style="width:0"></i></div>
      </div>
    </div>
    <div id="questArea"></div>
    <p class="small" id="streakLine" style="text-align:center"></p>
  </section>

  <!-- JELVÉNYEK -->
  <section class="view" id="v-badges">
    <div class="card stats">
      <div class="stat"><b id="sDone">0</b><span class="small">küldetés</span></div>
      <div class="stat"><b id="sStreak">0</b><span class="small">napos széria</span></div>
      <div class="stat"><b id="sBest">0</b><span class="small">legjobb széria</span></div>
    </div>
    <h2>Jelvények <span class="small" id="badgeCount"></span></h2>
    <div class="badges" id="badgeGrid"></div>
  </section>

  <!-- NAPLÓ -->
  <section class="view" id="v-log">
    <h2>Kalandnapló</h2>
    <div class="card" id="logList"></div>
  </section>
</main>

<nav>
  <button class="active" data-view="v-quest"><span>🎯</span>Küldetés</button>
  <button data-view="v-badges"><span>🏅</span>Jelvények</button>
  <button data-view="v-log"><span>📔</span>Napló</button>
</nav>
<div class="toast" id="toast"></div>
<input type="file" accept="image/*" capture="environment" id="fileInput" hidden>

<script>
const CATS = {
  foto:   { ico: '📸', name: 'Fotó' },
  szo:    { ico: '💬', name: 'Beszélgetés' },
  mozgas: { ico: '🚶', name: 'Mozgás' },
  kreativ:{ ico: '🎨', name: 'Kreatív' },
  figyel: { ico: '🔍', name: 'Megfigyelés' },
  kedves: { ico: '💛', name: 'Kedvesség' },
};

// [kategória, nehézség 1-3, szöveg]
const QUESTS = [
  ['foto', 1, 'Fotózz le valami kéket, ami nem ég.'],
  ['foto', 1, 'Keress egy felhőt, ami hasonlít valamire, és fotózd le.'],
  ['foto', 1, 'Fotózz le egy arcot ott, ahol nincs arc (konnektor, ház, táska…).'],
  ['foto', 2, 'Fotózz le öt különböző sárga dolgot egy nap alatt.'],
  ['foto', 1, 'Fotózd le a legfurcsább feliratot, amit ma látsz.'],
  ['foto', 2, 'Készíts egy fotót egy hétköznapi tárgyról úgy, mintha drága reklám lenne.'],
  ['foto', 1, 'Fotózz le valamit, ami pontosan olyan idős lehet, mint te.'],
  ['foto', 2, 'Fotózz le egy árnyékot, ami érdekesebb, mint a tárgy, ami veti.'],
  ['foto', 1, 'Fotózz le egy kört, ami nem kerék.'],
  ['foto', 3, 'Készíts egy fotósorozatot a szivárvány összes színéből – egy dolog színenként.'],
  ['foto', 1, 'Fotózd le a nap legszebb ablakát.'],
  ['foto', 2, 'Fotózz le egy macskát vagy kutyát – de csak ha ő is beleegyezik. 🐾'],
  ['szo', 1, 'Kérdezz meg valakit a kedvenc szaváról.'],
  ['szo', 1, 'Kérdezd meg valakitől, mi volt a legjobb dolog a hetében.'],
  ['szo', 2, 'Kérdezz meg valakit, mit csinálna, ha egy napig láthatatlan lenne.'],
  ['szo', 1, 'Mondj egy őszinte bókot valakinek, akinek még sosem mondtál.'],
  ['szo', 2, 'Hívj fel valakit, akivel több mint egy hónapja nem beszéltél.'],
  ['szo', 2, 'Kérj egy ajánlást egy idegentől (könyv, zene, kaja – bármi).'],
  ['szo', 1, 'Kérdezd meg valakitől, mi volt gyerekkorában a kedvenc játéka.'],
  ['szo', 3, 'Tanulj meg valakitől egy szót egy olyan nyelven, amit nem beszélsz.'],
  ['szo', 1, 'Kérdezz meg valakit, melyik a legfurcsább étel, amit valaha evett.'],
  ['szo', 2, 'Mesélj el valakinek egy vicceset, ami veled történt – és kérj cserébe egyet.'],
  ['szo', 1, 'Kérdezd meg valakitől: „Ha állat lennél, melyik lennél?”'],
  ['mozgas', 1, 'Menj haza (vagy valahova) egy olyan úton, amin még sosem jártál.'],
  ['mozgas', 1, 'Lépj ki az ajtón, és sétálj 10 percet egyetlen irányba, amerre a szél fúj.'],
  ['mozgas', 2, 'Számold meg, hány lépcsőfokot mászol meg ma.'],
  ['mozgas', 1, 'Táncolj egy teljes számot, úgy, hogy senki se lássa. Vagy úgy, hogy igen.'],
  ['mozgas', 2, 'Találj egy padot, ahol még sosem ültél, és ülj rajta 5 percet.'],
  ['mozgas', 1, 'Csinálj 20 guggolást valahol, ahol nem szoktál.'],
  ['mozgas', 2, 'Sétálj el a legközelebbi fához, és keress rajta valami élőt.'],
  ['mozgas', 3, 'Juss el egy olyan helyre a városban, ahol még sosem voltál.'],
  ['mozgas', 1, 'Menj fel a legmagasabb pontra, ahova ma könnyen eljutsz, és nézz körül.'],
  ['mozgas', 2, 'Ma minden liftet hagyj ki – csak lépcső!'],
  ['kreativ', 1, 'Rajzolj le egy tárgyat a bal kezeddel (vagy a jobbal, ha balkezes vagy).'],
  ['kreativ', 2, 'Írj egy négysoros verset arról, amit reggel ettél.'],
  ['kreativ', 1, 'Adj nevet egy tárgynak a környezetedben, és mutasd be valakinek.'],
  ['kreativ', 2, 'Építs egy apró szobrot abból, ami épp a zsebedben vagy a táskádban van.'],
  ['kreativ', 1, 'Találj ki egy új szót, és használd ma legalább háromszor.'],
  ['kreativ', 2, 'Írj egy 6 szavas történetet.'],
  ['kreativ', 3, 'Főzz vagy készíts valamit, amit még sosem csináltál.'],
  ['kreativ', 1, 'Dúdolj el egy dallamot, amit most találsz ki, és vedd fel hangüzenetben.'],
  ['kreativ', 2, 'Rajzold le, hogy néz ki a hangulatod ma – szavak nélkül.'],
  ['kreativ', 2, 'Írj egy rövid levelet a 10 év múlva élő önmagadnak.'],
  ['kreativ', 1, 'Rendezd szín szerint valamit: könyveket, ceruzákat, zoknikat…'],
  ['figyel', 1, 'Számold meg, hány piros autót látsz egy óra alatt.'],
  ['figyel', 1, 'Állj meg egy percre, csukd be a szemed, és számold össze, hány hangot hallasz.'],
  ['figyel', 2, 'Keress egy dolgot az utcán, ami valószínűleg 100 évnél idősebb.'],
  ['figyel', 1, 'Figyeld meg, hány ember mosolyog az utcán 10 perc alatt.'],
  ['figyel', 2, 'Találj egy madarat, és figyeld 2 percig, mit csinál.'],
  ['figyel', 1, 'Keress egy szót egy plakáton, amit nem ismersz, és nézz utána.'],
  ['figyel', 2, 'Keress egy szívet a városban (falfirka, levél, folt – bármi szív alakú).'],
  ['figyel', 1, 'Nézd meg ma a naplementét – az egészet, telefon nélkül.'],
  ['figyel', 3, 'Keress három dolgot, amik a te kezdőbetűddel kezdődnek, és mind zöldek.'],
  ['figyel', 1, 'Szagolj meg öt különböző dolgot, és döntsd el, melyik a legjobb illat.'],
  ['figyel', 2, 'Kóstolj meg egy gyümölcsöt vagy zöldséget, amit még sosem ettél.'],
  ['kedves', 1, 'Hagyj egy kedves cetlit valahol, ahol valaki megtalálja.'],
  ['kedves', 1, 'Köszönd meg valakinek valamit, amit természetesnek veszel.'],
  ['kedves', 2, 'Segíts valakinek valamiben anélkül, hogy kérné.'],
  ['kedves', 1, 'Küldj egy régi közös fotót valakinek, akivel rég beszéltél.'],
  ['kedves', 2, 'Dobj ki 10 szemetet, ami nem a tiéd.'],
  ['kedves', 1, 'Engedj előre valakit a sorban.'],
  ['kedves', 2, 'Írj egy pozitív értékelést egy helynek, ahol jól érezted magad.'],
  ['kedves', 3, 'Csinálj valami kedveset egy szomszédodnak.'],
  ['kedves', 1, 'Locsold meg egy növényt – akár a sajátodat, akár egy elhagyatottat.'],
];

const LEVELS = [
  [0, '🐣', 'Kezdő kalandor'],
  [50, '🐥', 'Kíváncsi felfedező'],
  [150, '🦊', 'Ravasz vándor'],
  [300, '🦉', 'Bölcs utazó'],
  [550, '🐉', 'Legendás kalandor'],
  [900, '🦄', 'Mesebeli hős'],
  [1400, '🌌', 'Kozmikus kóborló'],
];

const BADGES = [
  ['elso', '🌱', 'Első lépés', 'Teljesíts egy küldetést', s => s.done >= 1],
  ['tiz', '🔟', 'Belejöttél', '10 küldetés', s => s.done >= 10],
  ['otven', '🏔️', 'Kalandfüggő', '50 küldetés', s => s.done >= 50],
  ['szaz', '💯', 'Százas', '100 küldetés', s => s.done >= 100],
  ['sz3', '🔥', 'Lendület', '3 napos széria', s => s.best >= 3],
  ['sz7', '📅', 'Egy hét', '7 napos széria', s => s.best >= 7],
  ['sz30', '🌕', 'Egy hónap', '30 napos széria', s => s.best >= 30],
  ['foto', '📸', 'Paparazzi', '5 fotós küldetés', s => (s.cat.foto || 0) >= 5],
  ['szo', '💬', 'Csacsogó', '5 beszélgetős küldetés', s => (s.cat.szo || 0) >= 5],
  ['mozgas', '👟', 'Talpraesett', '5 mozgásos küldetés', s => (s.cat.mozgas || 0) >= 5],
  ['kreativ', '🎨', 'Művészlélek', '5 kreatív küldetés', s => (s.cat.kreativ || 0) >= 5],
  ['figyel', '🔍', 'Sasszem', '5 megfigyelős küldetés', s => (s.cat.figyel || 0) >= 5],
  ['kedves', '💛', 'Napsugár', '5 kedvességküldetés', s => (s.cat.kedves || 0) >= 5],
  ['mind', '🌈', 'Mindenes', 'Mindegyik kategóriából egy', s => Object.keys(CATS).every(c => s.cat[c])],
  ['nehez', '💪', 'Nem ijedek meg', '5 nehéz (⭐⭐⭐) küldetés', s => s.hard >= 5],
  ['bator', '🎯', 'Nincs csere', '10 küldetés újrasorsolás nélkül', s => s.noReroll >= 10],
  ['bagoly', '🦉', 'Éjjeli bagoly', 'Teljesíts egyet 22 óra után', s => s.night],
  ['pacsirta', '🐦', 'Korai madár', 'Teljesíts egyet reggel 8 előtt', s => s.early],
  ['bonusz', '⚡', 'Ráadás', 'Teljesíts egy bónuszküldetést', s => s.bonus >= 1],
  ['harom', '🎪', 'Nagy nap', '3 küldetés egyetlen nap alatt', s => s.maxDay >= 3],
  ['p500', '💎', 'Kincsvadász', '500 pont', s => s.points >= 500],
  ['p1000', '👑', 'Ezres', '1000 pont', s => s.points >= 1000],
];

const MAX_REROLLS = 2;
const STORE = 'veletlen-kaland-v1';

function today(d = new Date()) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function dayDiff(a, b) {
  return Math.round((new Date(b + 'T12:00') - new Date(a + 'T12:00')) / 86400000);
}

function load() {
  try {
    const s = JSON.parse(localStorage.getItem(STORE));
    if (s && s.log) return s;
  } catch (e) {}
  return { log: [], current: null, unlocked: [], noReroll: 0 };
}
let state = load();
function save() {
  try {
    localStorage.setItem(STORE, JSON.stringify(state));
  } catch (e) {
    // Valószínűleg megtelt a tárhely a fotók miatt – a legrégebbi fotókat eldobjuk.
    const withPhoto = state.log.filter(l => l.photo);
    if (withPhoto.length) {
      withPhoto[withPhoto.length - 1].photo = null;
      save();
    }
  }
}

function stats() {
  const s = { done: 0, points: 0, cat: {}, hard: 0, bonus: 0, night: false, early: false, noReroll: state.noReroll || 0, maxDay: 0, best: 0, streak: 0 };
  const perDay = {};
  for (const l of state.log) {
    s.done++;
    s.points += l.points;
    s.cat[l.cat] = (s.cat[l.cat] || 0) + 1;
    if (l.diff === 3) s.hard++;
    if (l.bonus) s.bonus++;
    const h = new Date(l.ts).getHours();
    if (h >= 22 || h < 4) s.night = true;
    if (h >= 4 && h < 8) s.early = true;
    perDay[l.day] = (perDay[l.day] || 0) + 1;
  }
  const days = Object.keys(perDay).sort();
  s.maxDay = Math.max(0, ...Object.values(perDay));
  let run = 0;
  for (let i = 0; i < days.length; i++) {
    run = i && dayDiff(days[i - 1], days[i]) === 1 ? run + 1 : 1;
    s.best = Math.max(s.best, run);
  }
  if (days.length && dayDiff(days[days.length - 1], today()) <= 1) s.streak = run;
  return s;
}

function level(points) {
  let i = 0;
  while (i + 1 < LEVELS.length && points >= LEVELS[i + 1][0]) i++;
  return { cur: LEVELS[i], next: LEVELS[i + 1] };
}

function pickQuest(excludeText) {
  const recent = new Set(state.log.slice(0, 25).map(l => l.text));
  let pool = QUESTS.filter(q => q[2] !== excludeText && !recent.has(q[2]));
  if (!pool.length) pool = QUESTS.filter(q => q[2] !== excludeText);
  const q = pool[Math.floor(Math.random() * pool.length)];
  return { cat: q[0], diff: q[1], text: q[2] };
}

function todayDone() { return state.log.filter(l => l.day === today()); }

let pendingPhoto = null;

function render() {
  const s = stats();
  document.getElementById('pointsPill').textContent = s.points + ' pont';
  const { cur, next } = level(s.points);
  document.getElementById('lvlEmoji').textContent = cur[1];
  document.getElementById('lvlName').textContent = cur[2];
  if (next) {
    document.getElementById('lvlInfo').textContent = (s.points - cur[0]) + ' / ' + (next[0] - cur[0]) + ' pont a következő szintig';
    document.getElementById('lvlBar').style.width = Math.min(100, (s.points - cur[0]) / (next[0] - cur[0]) * 100) + '%';
  } else {
    document.getElementById('lvlInfo').textContent = 'Elérted a legmagasabb szintet!';
    document.getElementById('lvlBar').style.width = '100%';
  }
  document.getElementById('streakLine').textContent = s.streak ? `🔥 ${s.streak} napos széria – ne szakítsd meg!` : 'Teljesíts egy küldetést, és indul a széria!';

  // Küldetés terület
  const area = document.getElementById('questArea');
  const cur_ = state.current && state.current.day === today() ? state.current : null;
  const doneToday = todayDone();
  if (!cur_) {
    const bonus = doneToday.length > 0;
    area.innerHTML = (bonus ? `
      <div class="card done-box">
        <div class="e">🎉</div>
        <b>A mai kaland megvan!</b>
        <p class="small">Ma már ${doneToday.length} küldetést teljesítettél. Kérsz még egyet bónuszként? (fél pont)</p>
      </div>` : '') + `
      <button class="big-btn" id="drawBtn">${bonus ? '⚡ Bónuszküldetés' : '🎲 Kérem a mai küldetést!'}
        <small>${bonus ? 'Csak ha bírod még' : 'Egy apró, fura feladat a napodra'}</small></button>`;
    document.getElementById('drawBtn').onclick = () => {
      state.current = { ...pickQuest(), day: today(), rerolls: 0, bonus };
      save(); render();
    };
  } else {
    const c = CATS[cur_.cat];
    const pts = questPoints(cur_);
    area.innerHTML = `
      <div class="card">
        <div class="quest-cat">${c.ico} ${c.name} · ${'⭐'.repeat(cur_.diff)} · ${pts} pont${cur_.bonus ? ' · bónusz' : ''}</div>
        <div class="quest-text">${esc(cur_.text)}</div>
        <img class="preview" id="preview">
        <textarea id="note" placeholder="Jegyzet (nem kötelező): mi történt?"></textarea>
        <div class="row">
          <button class="btn photo-btn" id="photoBtn">📷 Fotó</button>
          <button class="btn" id="rerollBtn" ${cur_.rerolls >= MAX_REROLLS ? 'disabled' : ''}>🔄 Másikat (${MAX_REROLLS - cur_.rerolls})</button>
        </div>
        <div class="row" style="margin-top:10px">
          <button class="btn primary" id="doneBtn">✅ Teljesítettem!</button>
        </div>
      </div>`;
    if (pendingPhoto) showPreview(pendingPhoto);
    document.getElementById('photoBtn').onclick = () => document.getElementById('fileInput').click();
    document.getElementById('rerollBtn').onclick = () => {
      if (cur_.rerolls >= MAX_REROLLS) return;
      state.current = { ...pickQuest(cur_.text), day: today(), rerolls: cur_.rerolls + 1, bonus: cur_.bonus };
      pendingPhoto = null;
      save(); render();
    };
    document.getElementById('doneBtn').onclick = () => complete(cur_);
  }
  renderBadges(s);
  renderLog();
}

function questPoints(q) {
  const base = q.diff * 10;
  return q.bonus ? Math.ceil(base / 2) : base;
}

function complete(q) {
  const note = document.getElementById('note').value.trim();
  const before = new Set(state.unlocked);
  const pts = questPoints(q);
  state.log.unshift({ day: today(), ts: Date.now(), cat: q.cat, diff: q.diff, text: q.text, points: pts, bonus: q.bonus, note, photo: pendingPhoto });
  state.noReroll = q.rerolls === 0 ? (state.noReroll || 0) + 1 : state.noReroll || 0;
  state.current = null;
  pendingPhoto = null;
  const s = stats();
  const fresh = BADGES.filter(b => b[4](s) && !before.has(b[0]));
  state.unlocked = BADGES.filter(b => b[4](s)).map(b => b[0]);
  save();
  confetti();
  toast(`+${pts} pont! 🎉`);
  fresh.forEach((b, i) => setTimeout(() => toast(`Új jelvény: ${b[1]} ${b[2]}`), 1800 * (i + 1)));
  render();
}

function renderBadges(s) {
  document.getElementById('sDone').textContent = s.done;
  document.getElementById('sStreak').textContent = s.streak;
  document.getElementById('sBest').textContent = s.best;
  const got = BADGES.filter(b => b[4](s)).length;
  document.getElementById('badgeCount').textContent = `(${got} / ${BADGES.length})`;
  document.getElementById('badgeGrid').innerHTML = BADGES.map(b => `
    <div class="bdg ${b[4](s) ? '' : 'locked'}"><span class="e">${b[1]}</span><b>${b[2]}</b>${b[3]}</div>`).join('');
}

function renderLog() {
  const el = document.getElementById('logList');
  if (!state.log.length) {
    el.innerHTML = '<p class="small">Még üres. Az első teljesített küldetésed ide kerül. ✨</p>';
    return;
  }
  el.innerHTML = state.log.map(l => `
    <div class="log-item">
      ${l.photo ? `<img src="${l.photo}" alt="">` : `<div class="ico">${CATS[l.cat].ico}</div>`}
      <div>
        <p class="small">${l.day} · +${l.points} pont${l.bonus ? ' · bónusz' : ''}</p>
        <p><b>${esc(l.text)}</b></p>
        ${l.note ? `<p>${esc(l.note)}</p>` : ''}
      </div>
    </div>`).join('');
}

function esc(t) {
  return t.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

function showPreview(src) {
  const p = document.getElementById('preview');
  if (!p) return;
  p.src = src;
  p.style.display = 'block';
}

document.getElementById('fileInput').addEventListener('change', e => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  const img = new Image();
  img.onload = () => {
    // Kicsinyítve tároljuk, hogy beférjen a telefon tárhelyébe.
    const max = 480;
    const r = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.round(img.width * r);
    c.height = Math.round(img.height * r);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    pendingPhoto = c.toDataURL('image/jpeg', 0.7);
    showPreview(pendingPhoto);
    URL.revokeObjectURL(img.src);
  };
  img.src = URL.createObjectURL(file);
});

document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('active', x === b));
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === b.dataset.view));
  window.scrollTo(0, 0);
});

let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1600);
}

function confetti() {
  const wrap = document.createElement('div');
  wrap.className = 'confetti';
  const colors = ['#ff7a45', '#ffb547', '#2f9e6e', '#4c8dff', '#c06cff'];
  for (let i = 0; i < 60; i++) {
    const p = document.createElement('i');
    p.style.left = Math.random() * 100 + 'vw';
    p.style.background = colors[i % colors.length];
    p.style.animationDelay = Math.random() * 0.4 + 's';
    wrap.appendChild(p);
  }
  document.body.appendChild(wrap);
  setTimeout(() => wrap.remove(), 2200);
}

// Éjfél után új nap: frissítsük, ha az app visszakerül előtérbe.
document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });

render();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
