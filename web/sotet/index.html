<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sötét Utas">
<title>Sötét Utas</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root {
  --bg: #0b0f24;
  --card: #141a38;
  --card-2: #1d2550;
  --text: #eef2ff;
  --muted: #9aa3cf;
  --pink: #ff3d8b;
  --cyan: #2de2e6;
  --orange: #ff9f43;
  --green: #4ade80;
  --red: #ff4d5e;
  --line: #2a3366;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body {
  background: linear-gradient(180deg, #1a1040 0%, var(--bg) 40%) fixed, var(--bg);
  color: var(--text);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  min-height: 100dvh;
  padding: env(safe-area-inset-top) 0 calc(20px + env(safe-area-inset-bottom));
}
main { max-width: 560px; margin: 0 auto; padding: 0 14px; }
h1 { font-size: 34px; margin: 26px 0 2px; background: linear-gradient(90deg, var(--pink), var(--cyan)); -webkit-background-clip: text; background-clip: text; color: transparent; }
h2 { font-size: 16px; margin: 16px 0 4px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin: 10px 0; }
.small { font-size: 12px; color: var(--muted); }
.center { text-align: center; }
.btn { border: 1px solid var(--line); background: var(--card-2); color: var(--text); border-radius: 12px; padding: 12px; font: inherit; font-weight: 700; cursor: pointer; text-align: left; }
.btn.full { width: 100%; display: block; margin-top: 8px; }
.btn.neon { background: linear-gradient(135deg, var(--pink), #b5179e); border-color: transparent; color: #fff; text-align: center; font-size: 18px; padding: 15px; }
.btn:disabled { opacity: .38; }
.btn .why { display: block; font-size: 12px; font-weight: 500; color: var(--muted); margin-top: 2px; }
.hud { position: sticky; top: 0; z-index: 5; background: rgba(11, 15, 36, .93); backdrop-filter: blur(8px); margin: 0 -14px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.hud-top { display: flex; justify-content: space-between; font-weight: 800; }
.slots { display: flex; gap: 4px; margin: 6px 0 8px; }
.slots span { flex: 1; text-align: center; font-size: 11px; padding: 3px 0; border-radius: 6px; background: var(--card); color: var(--muted); }
.slots span.now { background: var(--cyan); color: #04202a; font-weight: 800; }
.slots span.past { opacity: .4; text-decoration: line-through; }
.meters { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; }
.meter { font-size: 12px; }
.meter .bar { height: 8px; background: var(--card-2); border-radius: 99px; overflow: hidden; margin-top: 2px; }
.meter .bar i { display: block; height: 100%; border-radius: 99px; transition: width .4s; }
.meter.danger { color: var(--red); font-weight: 700; }
.target b { font-size: 17px; }
.dots { display: flex; gap: 6px; margin: 8px 0 2px; }
.dots i { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--cyan); }
.dots i.on { background: var(--cyan); }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.actions .btn { margin: 0; }
.log p { margin: 4px 0; font-size: 13px; }
.delta { font-size: 12px; font-weight: 700; margin-left: 4px; }
.event-e { font-size: 50px; }
.modal-bg { position: fixed; inset: 0; background: rgba(4, 6, 20, .78); display: none; align-items: center; justify-content: center; z-index: 20; padding: 16px; }
.modal-bg.show { display: flex; }
.modal { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 18px; width: 100%; max-width: 440px; text-align: center; animation: pop .22s ease; max-height: 92dvh; overflow: auto; }
@keyframes pop { from { opacity: 0; transform: scale(.95); } to { opacity: 1; transform: none; } }
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 12px 0; }
.cell { aspect-ratio: 1; border-radius: 12px; background: #e9eef7; display: grid; place-items: center; font-size: 30px; cursor: pointer; user-select: none; transition: transform .08s; }
.cell:active { transform: scale(.92); }
.cell.cleaned { background: #cfe9da; }
.timer { font-size: 30px; font-weight: 900; color: var(--cyan); font-variant-numeric: tabular-nums; }
.board-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--line); }
.board-row:last-child { border-bottom: 0; }
input[type=text] { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--card-2); color: var(--text); font: inherit; font-size: 16px; margin-top: 8px; }
.shake { animation: shake .4s; }
@keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
</style>
</head>
<body>
<main id="app"></main>
<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>

<script>
const STORE = 'sotet-utas-v1';
function loadState() { try { return JSON.parse(localStorage.getItem(STORE)) || {}; } catch (e) { return {}; } }
const S = Object.assign({ board: [], run: null, name: '' }, loadState());
function save() { try { localStorage.setItem(STORE, JSON.stringify(S)); } catch (e) {} }
const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const R = a => a[Math.floor(Math.random() * a.length)];
const clamp = v => Math.max(0, Math.min(100, Math.round(v)));
const chance = p => Math.random() < p;
const $ = id => document.getElementById(id);
const buzz = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };

// ---------- Tartalom ----------
const SLOTS = ['🌅 Reggel', '☀️ Délután', '🌆 Este', '🌙 Éjjel'];
const NAMES = ['Viktor', 'Ferenc', 'Henrik', 'Gizella', 'Roland', 'Anita', 'Dénes', 'Csaba', 'Mónika', 'Barnabás', 'Erika', 'Zsolt', 'Kálmán', 'Tímea', 'Gábor', 'Ottó'];
const JOBS = ['autókereskedő', 'ingatlanos', 'éjszakai klubtulajdonos', 'könyvelő', 'személyi edző', 'befektető', 'taxis', 'gondnok', 'jachtkapitány', 'magánorvos', 'üzletember', 'fotós'];
const CRIMES = [
  'cserbenhagyásos gázolás után megúszta a bíróságot', 'idős emberek megtakarításait csalta ki', 'felgyújtott egy lakóházat a biztosítási pénzért',
  'évekig zsarolt egy egész utcát', 'egy eljárási hiba miatt szabadult', 'eltüntetett egy fiatal lányt, de sosem találtak bizonyítékot',
  'drogot árult iskolák előtt', 'mérgezett ételt adott el, és lefizette az ellenőröket', 'embereket csempészett, majd magukra hagyta őket',
];

// Akciók: melyik napszakban lehet, mit csinál. A hatásokat a perform() kezeli.
const ACTIONS = {
  work:   { ico: '🔬', name: 'Munka a laborban', slots: [0, 1], energy: 10 },
  run:    { ico: '🏃', name: 'Futás a parton', slots: [0], energy: 10 },
  watch:  { ico: '🕵️', name: 'A célpont megfigyelése', slots: [1, 2, 3], energy: 15 },
  lili:   { ico: '❤️', name: 'Idő Lilivel', slots: [1, 2], energy: 5 },
  prep:   { ico: '🧰', name: 'Előkészítés', slots: [2, 3], energy: 15 },
  strike: { ico: '🔪', name: 'Lecsapás', slots: [3], energy: 25 },
  clean:  { ico: '🧽', name: 'Nyomok eltüntetése', slots: [2, 3], energy: 10 },
  rest:   { ico: '😴', name: 'Pihenés / alvás', slots: [0, 1, 2, 3], energy: 0 },
};

// Véletlen helyzetek két választással. Minden választás egy függvény, ami módosítja az állapotot és szöveget ad vissza.
const EVENTS = [
  { e: '🚔', t: 'Bakó őrmester a parkolóban vár: „Hova sietsz ilyen korán?”', c: [
    ['🍩 Mosolyogsz, és fánkot kínálsz neki', r => (d(r, { sus: -4 }), 'Elvette a fánkot. Morogva, de elvette.')],
    ['🙄 Szó nélkül továbbmész', r => (d(r, { sus: 8 }), 'Bakó hosszan néz utánad.')]] },
  { e: '📦', t: 'Lili egy furcsa dobozt talált a szekrényed mélyén.', c: [
    ['🎁 „Az a te ajándékod… lett volna.”', r => (d(r, { love: 6, energy: -8 }), 'Gyorsan vettél neki valami szépet. Megúsztad.')],
    ['🤐 Témát váltasz', r => (d(r, { love: -12, sus: 3 }), 'Lili megsértődött. És gyanakszik.')]] },
  { e: '🧑‍💼', t: 'A főnök túlórát kér: sürgős vérfolt-elemzés kell.', c: [
    ['🔬 Maradsz', r => (d(r, { sus: -6, energy: -15 }), 'A csapat szerint te vagy a legmegbízhatóbb kolléga.')],
    ['🏠 Hazamész', r => (d(r, { love: 6, sus: 3 }), 'Lili örült. A főnök kevésbé.')]] },
  { e: '👀', t: 'Egy szomszéd látta, hogy hajnalban jöttél haza.', c: [
    ['🏃 „Futni voltam.”', r => (d(r, { sus: 2 }), 'Bólint. Talán elhiszi.')],
    ['🚪 Bemész köszönés nélkül', r => (d(r, { sus: 7 }), 'A szomszéd elmesélte a házmesternek is.')]] },
  { e: '🌑', t: 'A Sötét Utas suttog. Nem hagy aludni.', c: [
    ['🏃 Elmész futni, hogy kiadd magadból', r => (d(r, { urge: -10, energy: -12 }), 'Egy kicsit csillapodott.')],
    ['😶 Megpróbálod elnyomni', r => (d(r, { urge: 10 }), 'Csak még hangosabb lett.')]] },
  { e: '🎂', t: 'Ma van Lili születésnapja!', c: [
    ['🎉 Meglepetés-vacsora', r => (d(r, { love: 20, energy: -18 }), 'Lili boldog. Te kimerült vagy.')],
    ['😬 …ma van?', r => (d(r, { love: -25 }), 'Lili egész este nem szólt hozzád.')]] },
  { e: '🧪', t: 'A laborba bekerült egy ügy, ami nagyon hasonlít az egyik „munkádra”.', c: [
    ['📝 Finoman félrevezető elemzést írsz', r => chance(.25) ? (d(r, { sus: 25 }), 'Egy kolléga észrevette a hibát. Ez rossz.') : (d(r, { sus: -12, urge: 4 }), 'Senki nem vette észre. Az ügy zsákutcába futott.')],
    ['🤷 Hagyod, dolgozzanak rajta', r => (d(r, { sus: 10 }), 'A nyomozók egyre közelebb járnak…')]] },
  { e: '🚗', t: 'Bakó át akarja kutatni a kocsidat.', c: [
    ['🔑 Odaadod a kulcsot', r => r.cleanedToday || chance(.55) ? (d(r, { sus: -10 }), 'Semmit nem talált. Bakó dühösen elviharzik.') : (d(r, { sus: 22 }), 'Talált egy fóliadarabot. Kínos magyarázkodás következett.')],
    ['⚖️ Ügyvédet kérsz', r => (d(r, { sus: 12 }), 'Jogod van hozzá. De ártatlanok ritkán kérnek ügyvédet.')]] },
  { e: '🍽️', t: 'A kollégák meghívnak egy közös vacsorára.', c: [
    ['😄 Elmész', r => (d(r, { sus: -5, energy: -10 }), 'Elmesélted a „vicces” labortörténeteidet. Mindenki nevetett.')],
    ['🙅 Nemet mondasz', r => (d(r, { sus: 3 }), '„Mindig ilyen magának való…”')]] },
  { e: '📺', t: 'A híradó az „Éjjeli Igazságosztóról” beszél. Rólad.', c: [
    ['📴 Kikapcsolod', r => (d(r, {}), 'Jobb nem tudni.')],
    ['😏 Végignézed', r => (d(r, { urge: -6, sus: 2 }), 'Lili furcsán néz rád: „Miért mosolyogsz?”')]] },
  { e: '🫣', t: 'A célpont mintha észrevette volna, hogy követik.', c: [
    ['↩️ Pár napig hagyod', r => (r.target.obs = Math.max(0, r.target.obs - 1), 'Elvesztettél egy megfigyelést, de biztonságban vagy.')],
    ['🎯 Folytatod', r => chance(.4) ? (d(r, { sus: 15 }), 'Szemtől szemben kerültetek. Bejelentést tett.') : (r.target.obs = Math.min(r.target.need, r.target.obs + 1), 'Nem vett észre. Újabb részlet a napirendjéről.')]] },
  { e: '🏡', t: 'Lili össze akar költözni.', c: [
    ['💍 Igen!', r => (d(r, { love: 20, sus: -6, urge: 6 }), 'Tökéletes családi álca. Csak a titkaidat lesz nehezebb rejtegetni.')],
    ['⏳ Még nem', r => (d(r, { love: -15 }), 'Lili csalódott.')]] },
  { e: '🗃️', t: 'Nem találod az egyik tárgylemezt a gyűjteményedből!', c: [
    ['🔦 Egész éjjel keresed', r => (d(r, { energy: -25 }), 'Megvan. A kocsi ülése alá esett.')],
    ['😰 Hagyod', r => (d(r, { sus: 10 }), 'Reméled, hogy senki nem találja meg…')]] },
  { e: '🌴', t: 'Bakó őrmester egy hétre szabadságra megy.', c: [
    ['😌 Végre', r => (d(r, { sus: -15 }), 'Egy kis nyugalom.')]] },
  { e: '🐶', t: 'Egy kóbor kutya követ hazáig, és ugat a csomagtartóra.', c: [
    ['🍖 Megeteted, és elküldöd', r => (d(r, { energy: -5 }), 'Elégedetten elkocogott.')],
    ['🚗 Gyorsan elhajtasz', r => (d(r, { sus: 4 }), 'Egy járókelő felírta a rendszámodat. Biztos csak véletlen.')]] },
];
const MIAMI = ['A miami nap kíméletlenül tűz.', 'Pálmafák, sós levegő, és egy titok, amit senki sem sejt.', 'Egy újabb tökéletesen normális nap.', 'Lili kávét főzött. Kedves.', 'A labor csendes. Túl csendes.'];

// ---------- Állapot ----------
function d(r, delta) {
  for (const k of Object.keys(delta)) {
    const before = r[k];
    r[k] = clamp(r[k] + delta[k]);
    if (r[k] !== before) r.log.unshift({ k, v: r[k] - before });
  }
}
function newTarget(day) {
  return { name: R(NAMES), job: R(JOBS), crime: R(CRIMES), need: Math.min(4, 2 + Math.floor(day / 6) + (chance(.3) ? 1 : 0)), obs: 0, prep: false, innocentChecked: false };
}
function newRun() {
  S.run = { day: 1, slot: 0, urge: 20, sus: 5, love: 60, energy: 80, kills: 0, worked: false, cleanedToday: false, target: newTarget(1), log: [], story: ['Miami. Nappal vérfolt-elemző vagy a rendőrségen. Éjjel… a Sötét Utas dönt.'], over: null };
  save(); render();
}

const LABEL = { urge: '🩸 Sötét Utas', sus: '🕵️ Gyanú', love: '❤️ Lili', energy: '⚡ Energia' };

function perform(key) {
  const r = S.run, a = ACTIONS[key];
  r.log = [];
  r.energy = clamp(r.energy - a.energy);
  let msg = '';
  switch (key) {
    case 'work': d(r, { sus: -5 }); r.worked = true; msg = R(['Precíz elemzés. A főnök elégedett.', 'Egész nap vérfoltokat elemeztél. A szakmád.', 'Megoldottál egy ügyet a kollégáknak. Hős vagy.']); break;
    case 'run': d(r, { urge: -8 }); msg = 'Futás a parton. A Sötét Utas egy kicsit elcsendesedett.'; break;
    case 'lili': d(r, { love: 15, sus: -2 }); msg = R(['Moziztatok. Lili a válladra hajtotta a fejét.', 'Főztetek együtt. Majdnem normális voltál.', 'Sétáltatok a parton. Lili sokat nevetett.']); break;
    case 'rest': d(r, { energy: r.slot === 3 ? 50 : 30 }); msg = r.slot === 3 ? 'Végigaludtad az éjszakát.' : 'Lepihentél egy kicsit.'; break;
    case 'clean': d(r, { sus: -8 }); r.cleanedToday = true; msg = 'Kitakarítottad a csomagtartót, eltüntettél minden apró nyomot.'; break;
    case 'watch': {
      const t = r.target;
      d(r, { sus: 4 });
      // A Kód: néha kiderül, hogy a célpont mégsem bűnös.
      if (!t.innocentChecked && t.obs === 1 && chance(.15)) {
        r.target = newTarget(r.day);
        msg = `Kiderült: ${t.name} ártatlan – valaki más volt a tettes. A Kód szerint ő nem célpont. Új akta: ${r.target.name}.`;
        break;
      }
      t.innocentChecked = t.innocentChecked || t.obs >= 1;
      if (chance(.12)) { d(r, { sus: 10 }); msg = `${t.name} majdnem észrevett. Gyorsan elbújtál.`; }
      else msg = R([`Megtudtad, mikor jár haza ${t.name}.`, `Lefényképezted ${t.name} titkos találkozóját.`, `Megvan a bizonyíték: ${t.name} tényleg bűnös.`]);
      t.obs = Math.min(t.need, t.obs + 1);
      break;
    }
    case 'prep': r.target.prep = true; d(r, { sus: 2 }); msg = 'Fólia, eszközök, a hely kiválasztva. Minden készen áll.'; break;
    case 'strike': return startStrike();
  }
  finishAction(msg);
}

function finishAction(msg) {
  const r = S.run;
  r.story.unshift(msg);
  if (checkOver()) return;
  // Esemény az akció után (nem mindig).
  if (chance(.3)) { showEvent(); return; }
  advance();
}

function advance() {
  const r = S.run;
  r.slot++;
  if (r.slot > 3) newDay();
  if (r.energy <= 0 && !checkOver()) {
    r.log = []; d(r, { sus: 5 }); r.energy = 20;
    r.story.unshift('Kimerültségtől összeestél a laborban. A kollégák furcsán néztek.');
  }
  if (checkOver()) return;
  save(); render();
}

function newDay() {
  const r = S.run;
  r.day++; r.slot = 0; r.worked = false; r.cleanedToday = false;
  r.log = [];
  // Bakó egyre jobban szaglászik, a Sötét Utas egyre éhesebb – idővel minden nehezebb.
  d(r, { urge: 10 + Math.floor(r.day / 3), love: -6, sus: 1 + Math.floor(r.day / 4) });
  r.story.unshift(`📅 ${r.day}. nap. ${R(MIAMI)}`);
  // Ha a Sötét Utas átveszi az irányítást: meggondolatlan éjszaka.
  if (r.urge >= 100) {
    r.urge = 35; r.kills++;
    d(r, { sus: 35, energy: -20 });
    r.story.unshift('🌑 Elvesztetted az irányítást. A Sötét Utas cselekedett helyetted – meggondolatlanul, nyomokat hagyva.');
    buzz([200, 100, 200]);
  }
  if (r.love <= 0) {
    r.love = 35;
    d(r, { sus: 25 });
    r.story.unshift('💔 Lili szakított veled – és elmondta Bakónak, milyen furcsán viselkedtél.');
  }
}

function checkOver() {
  const r = S.run;
  if (r.sus >= 100) { r.over = 'busted'; save(); render(); return true; }
  return false;
}

// ---------- Esemény ----------
function showEvent() {
  const r = S.run;
  const ev = R(EVENTS.filter(e => e.e !== '🫣' || r.target.obs > 0));
  $('modal').innerHTML = `<div class="event-e">${ev.e}</div><p style="font-size:17px;font-weight:700">${esc(ev.t)}</p>` +
    ev.c.map((c, i) => `<button class="btn full" data-ch="${i}">${esc(c[0])}</button>`).join('');
  $('modalBg').classList.add('show');
  buzz(30);
  $('modal').querySelectorAll('[data-ch]').forEach(b => b.onclick = () => {
    r.log = [];
    const res = ev.c[+b.dataset.ch][1](r);
    r.story.unshift(`${ev.e} ${res}`);
    $('modal').innerHTML = `<div class="event-e">${ev.e}</div><p>${esc(res)}</p>${deltaHtml(r.log)}<button class="btn neon full" id="evOk">Tovább</button>`;
    $('evOk').onclick = () => { $('modalBg').classList.remove('show'); if (!checkOver()) advance(); };
  });
}
function deltaHtml(log) {
  if (!log.length) return '';
  return '<p>' + log.map(l => {
    const good = (l.k === 'sus' || l.k === 'urge') ? l.v < 0 : l.v > 0;
    return `<span class="delta" style="color:${good ? 'var(--green)' : 'var(--red)'}">${LABEL[l.k]} ${l.v > 0 ? '+' : ''}${l.v}</span>`;
  }).join(' ') + '</p>';
}

// ---------- Lecsapás + takarítás mini-játék ----------
function startStrike() {
  const r = S.run, t = r.target;
  const spots = Math.min(14, 6 + Math.floor(r.day / 2));
  const time = Math.max(6, 11 - Math.floor(r.day / 8));
  $('modal').innerHTML = `<div class="event-e">🧽</div><p style="font-weight:800;font-size:17px">${esc(t.name)} többé nem árt senkinek.</p>
    <p>Most gyorsan: takaríts fel minden nyomot! Koppints a 🩸 foltokra.</p><button class="btn neon full" id="goClean">Kezdés</button>`;
  $('modalBg').classList.add('show');
  $('goClean').onclick = () => cleanGame(spots, time);
}
function cleanGame(total, seconds) {
  let left = total, shown = 0, timeLeft = seconds * 10;
  const cells = 16;
  $('modal').innerHTML = `<div class="timer" id="cT">${seconds.toFixed(1)}</div><div class="small" id="cL">Hátravan: ${total} folt</div><div class="grid" id="cG">${'<div class="cell"></div>'.repeat(cells)}</div>`;
  const grid = [...$('cG').children];
  const spawn = () => {
    if (shown >= total) return;
    const free = grid.filter(c => !c.textContent);
    if (!free.length) return;
    const c = R(free); c.textContent = '🩸'; c.classList.remove('cleaned'); shown++;
  };
  for (let i = 0; i < Math.min(4, total); i++) spawn();
  grid.forEach(c => c.onclick = () => {
    if (c.textContent !== '🩸') return;
    c.textContent = ''; c.classList.add('cleaned'); left--; buzz(15);
    $('cL').textContent = `Hátravan: ${left} folt`;
    spawn();
    if (left <= 0) end();
  });
  const iv = setInterval(() => {
    timeLeft--;
    $('cT').textContent = (timeLeft / 10).toFixed(1);
    if (timeLeft % 7 === 0) spawn();
    if (timeLeft <= 0) end();
  }, 100);
  let ended = false;
  function end() {
    if (ended) return; ended = true; clearInterval(iv);
    const r = S.run;
    r.log = [];
    r.kills++;
    d(r, { urge: -60, sus: (r.worked ? 3 : 10) + left * 5 });
    const msg = left ? `${left} nyom maradt a helyszínen. ${r.worked ? '' : 'És ma nem is dolgoztál – nincs alibid.'}` : `Tökéletes munka. Egy újabb tárgylemez a gyűjteményben.${r.worked ? '' : ' (De ma nem dolgoztál – gyenge az alibid.)'}`;
    r.story.unshift(`🔪 ${r.target.name} ügye lezárva. ${msg}`);
    r.target = newTarget(r.day);
    $('modal').innerHTML = `<div class="event-e">${left ? '😰' : '✨'}</div><p style="font-weight:800">${left ? 'Maradtak nyomok…' : 'Makulátlan!'}</p><p>${esc(msg)}</p>${deltaHtml(r.log)}<button class="btn neon full" id="cOk">Tovább</button>`;
    $('cOk').onclick = () => { $('modalBg').classList.remove('show'); if (!checkOver()) advance(); };
  }
}

// ---------- Megjelenítés ----------
const app = $('app');
function meter(k, v) {
  const colors = { urge: 'var(--pink)', sus: 'var(--orange)', love: 'var(--red)', energy: 'var(--cyan)' };
  const danger = (k === 'urge' || k === 'sus') ? v >= 75 : v <= 20;
  return `<div class="meter ${danger ? 'danger' : ''}">${LABEL[k]} <b>${v}</b><div class="bar"><i style="width:${v}%;background:${colors[k]}"></i></div></div>`;
}
function why(key) {
  const r = S.run, a = ACTIONS[key], t = r.target;
  if (!a.slots.includes(r.slot)) return 'Most nem lehet';
  if (key !== 'rest' && r.energy < a.energy) return 'Túl fáradt vagy';
  if (key === 'prep' && t.obs < t.need) return `Még ${t.need - t.obs} megfigyelés kell`;
  if (key === 'prep' && t.prep) return 'Már kész';
  if (key === 'strike' && t.obs < t.need) return 'A Kód: előbb bizonyosodj meg!';
  if (key === 'strike' && !t.prep) return 'Előbb készülj elő';
  if (key === 'clean' && r.sus === 0) return 'Nincs mit eltüntetni';
  if (key === 'clean' && r.cleanedToday) return 'Ma már takarítottál';
  if (key === 'work' && r.worked) return 'Ma már dolgoztál';
  return '';
}

function render() {
  app.classList.remove('shake');
  const r = S.run;
  if (!r) return renderMenu();
  if (r.over) return renderOver();
  const t = r.target;
  app.innerHTML = `
    <div class="hud">
      <div class="hud-top"><span>📅 ${r.day}. nap</span><span>🔪 ${r.kills}</span></div>
      <div class="slots">${SLOTS.map((s, i) => `<span class="${i === r.slot ? 'now' : i < r.slot ? 'past' : ''}">${s}</span>`).join('')}</div>
      <div class="meters">${['urge', 'sus', 'love', 'energy'].map(k => meter(k, r[k])).join('')}</div>
    </div>
    <div class="card target">
      <div class="small">🎯 Jelenlegi akta</div>
      <b>${esc(t.name)}</b>, ${esc(t.job)}
      <div class="small">${esc(t.crime)}.</div>
      <div class="dots">${Array.from({ length: t.need }, (_, i) => `<i class="${i < t.obs ? 'on' : ''}"></i>`).join('')}<span class="small" style="margin-left:4px">megfigyelés${t.prep ? ' · 🧰 előkészítve' : ''}</span></div>
    </div>
    <h2>Mit csinálsz ${SLOTS[r.slot].split(' ')[1].toLowerCase()}?</h2>
    <div class="actions">
      ${Object.keys(ACTIONS).map(k => { const w = why(k); return `<button class="btn" data-act="${k}" ${w ? 'disabled' : ''}>${ACTIONS[k].ico} ${ACTIONS[k].name}${w ? `<span class="why">${w}</span>` : ACTIONS[k].energy ? `<span class="why">−${ACTIONS[k].energy} ⚡</span>` : ''}</button>`; }).join('')}
    </div>
    <div class="card log">${r.story.slice(0, 6).map((s, i) => `<p style="${i ? 'color:var(--muted)' : ''}">${esc(s)}</p>`).join('')}</div>
    <button class="btn full" id="toMenu" style="text-align:center">☰ Menü</button>`;
  app.querySelectorAll('[data-act]').forEach(b => b.onclick = () => perform(b.dataset.act));
  $('toMenu').onclick = () => { S.paused = true; save(); renderMenu(); };
}

function boardHtml(hl) {
  if (!S.board.length) return '<p class="small" style="margin:0">Még nincs eredmény.</p>';
  return S.board.map((b, i) => `<div class="board-row" style="${b.id === hl ? 'color:var(--pink)' : ''}"><span>${['🥇', '🥈', '🥉'][i] || (i + 1) + '.'} <b>${esc(b.name)}</b> <span class="small">${b.date} · 🔪 ${b.kills}</span></span><b>${b.days} nap</b></div>`).join('');
}
function renderMenu() {
  const r = S.run;
  app.innerHTML = `
    <h1>🌴 Sötét Utas</h1>
    <p class="small">Miami. Nappal tisztelt vérfolt-elemző vagy, barátnővel és kollégákkal. Éjjel a Sötét Utas követeli a magáét. Tartsd egyensúlyban a kettős életed – ameddig csak bírod.</p>
    ${r && !r.over ? `<button class="btn neon full" id="resume">▶️ Folytatás – ${r.day}. nap</button>` : ''}
    <button class="btn ${r && !r.over ? '' : 'neon'} full" id="new" style="text-align:center">🔪 Új játék</button>
    <h2>🏆 Ranglista – legtöbb túlélt nap</h2>
    <div class="card">${boardHtml()}</div>
    <h2>Hogyan játssz?</h2>
    <div class="card small" style="color:var(--text)">
      <p>• Minden nap 4 napszakból áll. Mindegyikben egy dolgot csinálhatsz.</p>
      <p>• 🩸 <b>Sötét Utas</b>: minden nap nő. Ha eléri a 100-at, elveszted az irányítást – meggondolatlanul cselekszel, ami nagyon gyanús.</p>
      <p>• 🕵️ <b>Gyanú</b>: ha eléri a 100-at, Bakó őrmester letartóztat. Vége.</p>
      <p>• ❤️ <b>Lili</b> a legjobb álcád. Ha elhanyagolod, szakít – és elmondja Bakónak, milyen furcsa vagy.</p>
      <p>• ⚡ <b>Energia</b>: minden akció fáraszt. Pihenj, különben összeesel.</p>
      <p>• 🎯 <b>A Kód</b>: csak elég megfigyelés után csaphatsz le – és néha kiderül, hogy a célpont ártatlan.</p>
      <p>• 🔪 Lecsapás után gyorsan takaríts fel minden nyomot! Ha aznap dolgoztál, van alibid.</p>
    </div>`;
  const res = $('resume');
  if (res) res.onclick = () => { S.paused = false; save(); render(); };
  $('new').onclick = () => { if (r && !r.over && !confirm('Feladod a mostani játékot? Nem kerül a ranglistára.')) return; newRun(); };
}

function renderOver() {
  const r = S.run;
  const days = r.day - 1;
  app.innerHTML = `
    <div class="card center" style="margin-top:24px">
      <div class="event-e">🚔</div>
      <h2 style="font-size:22px">Lebuktál!</h2>
      <p>Bakó őrmester bilincset kattint a csuklódon: „Tudtam, hogy te vagy az. Mindig is tudtam.”</p>
      <p style="font-size:22px;font-weight:900">📅 ${days} túlélt nap · 🔪 ${r.kills}</p>
    </div>
    ${r.saved ? '' : `<div class="card"><b>Írd fel magad a ranglistára</b><input type="text" id="nm" maxlength="18" placeholder="A neved" value="${esc(S.name)}"><button class="btn neon full" id="sv">🏆 Mentés</button></div>`}
    <h2>🏆 Ranglista</h2><div class="card">${boardHtml(r.saved)}</div>
    <button class="btn neon full" id="again">🔪 Új játék</button>
    <button class="btn full" id="menu" style="text-align:center">☰ Menü</button>`;
  app.classList.add('shake'); buzz([300, 100, 300]);
  const sv = $('sv');
  if (sv) sv.onclick = () => {
    const name = $('nm').value.trim() || 'Névtelen';
    S.name = name;
    const id = Date.now(), dt = new Date();
    S.board.push({ id, name, days, kills: r.kills, date: `${dt.getFullYear()}.${String(dt.getMonth() + 1).padStart(2, '0')}.${String(dt.getDate()).padStart(2, '0')}` });
    S.board.sort((a, b) => b.days - a.days || b.kills - a.kills || a.id - b.id);
    S.board = S.board.slice(0, 10);
    r.saved = id; save(); render();
  };
  $('again').onclick = newRun;
  $('menu').onclick = () => { S.run = null; save(); render(); };
}

if (S.run && !S.run.over && S.paused) renderMenu(); else render();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
