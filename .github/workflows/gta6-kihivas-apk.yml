name: GTA VI Kihívás APK (Android)

on:
  push:
    paths: ['gta6-kihivas/**', '.github/workflows/gta6-kihivas-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Függőségek telepítése
        working-directory: gta6-kihivas
        run: npm install --no-audit --no-fund
      - name: Android projekt létrehozása
        working-directory: gta6-kihivas
        run: |
          npx cap add android
          npx cap sync android
      - name: Ikon és indítókép generálása
        working-directory: gta6-kihivas
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#120a1f' --iconBackgroundColorDark '#120a1f' --splashBackgroundColor '#120a1f' --splashBackgroundColorDark '#120a1f'
      - name: Vissza gomb natív kezelő bemásolása
        working-directory: gta6-kihivas
        run: |
          base=android/app/src/main
          mkdir -p "$base/java/hu/taky/gta6kihivas"
          cp native/java/MainActivity.java "$base/java/hu/taky/gta6kihivas/MainActivity.java"
      - name: Állandó aláíró kulcs
        run: mkdir -p ~/.android && cp gta6-kihivas/debug.keystore ~/.android/debug.keystore
      - name: SDK útvonal
        working-directory: gta6-kihivas/android
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
      - name: APK építése
        working-directory: gta6-kihivas/android
        run: ./gradlew --no-daemon assembleDebug
      - name: APK átnevezése
        run: cp gta6-kihivas/android/app/build/outputs/apk/debug/app-debug.apk GTA6Kihivas.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GTA6Kihivas-apk
          path: GTA6Kihivas.apk
      - name: Kiadás (csak a main ágon)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete gta6-kihivas-apk --yes --cleanup-tag || true
          gh release create gta6-kihivas-apk GTA6Kihivas.apk --target "${{ github.sha }}" \
            --title "GTA VI Kihívás Generátor – Android (APK)" \
            --notes "Töltsd le a GTA6Kihivas.apk fájlt, és telepítsd (ismeretlen forrásból telepítést engedélyezni kell). GTA VI kihívás-generátor: saját kihívásokat készítesz (nehézséggel), a generátor pörget belőlük, vagy blokk-kombó módban akció+helyszín+csavar random kihívásokat gyárt (menthetők a listába). Felteheted a játékról a képeket, és a generált kihívás-kártya ezekre kerül rá – a kártyát képként meg is oszthatod. Minden offline, a telefonon tárolva."
