name: Rajzfilm Retró APK (Android)

on:
  push:
    paths: ['rajzfilm-apk/**', '.github/workflows/rajzfilm-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Függőségek telepítése
        working-directory: rajzfilm-apk
        run: npm install --no-audit --no-fund

      - name: Android projekt létrehozása
        working-directory: rajzfilm-apk
        run: |
          npx cap add android
          npx cap sync android

      - name: Ikon és indítókép generálása
        working-directory: rajzfilm-apk
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#141414' --iconBackgroundColorDark '#141414' --splashBackgroundColor '#141414' --splashBackgroundColorDark '#141414'

      - name: Vissza gomb natív kezelő bemásolása
        working-directory: rajzfilm-apk
        run: |
          base=android/app/src/main
          mkdir -p "$base/java/hu/taky/rajzfilm"
          cp native/java/MainActivity.java "$base/java/hu/taky/rajzfilm/MainActivity.java"

      - name: Állandó aláíró kulcs (hogy a frissítések törlés nélkül települjenek)
        run: mkdir -p ~/.android && cp rajzfilm-apk/debug.keystore ~/.android/debug.keystore

      - name: SDK útvonal
        working-directory: rajzfilm-apk/android
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: APK építése
        working-directory: rajzfilm-apk/android
        run: ./gradlew --no-daemon assembleDebug

      - name: APK átnevezése
        run: cp rajzfilm-apk/android/app/build/outputs/apk/debug/app-debug.apk RajzfilmRetro.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RajzfilmRetro-apk
          path: RajzfilmRetro.apk

      - name: Kiadás (csak a main ágon)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete rajzfilm-apk --yes --cleanup-tag || true
          gh release create rajzfilm-apk RajzfilmRetro.apk --target "${{ github.sha }}" \
            --title "Rajzfilm Retró – Android (APK)" \
            --notes "Töltsd le a RajzfilmRetro.apk fájlt a telefonodra, és telepítsd (az ismeretlen forrásból telepítést engedélyezni kell). Régi Cartoon Network sorozatok (Ed, Edd és Eddy, Dexter laboratóriuma, Johnny Test, Bátor, a gyáva kutya, Fosterék háza, Billy és Mandy) epizódlistája, megnézett részek követése, véletlen rész, és hogy hol nézhetők meg legálisan."
