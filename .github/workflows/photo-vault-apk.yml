name: Privát Széf APK (Android)

on:
  push:
    paths: ['photo-vault/**', '.github/workflows/photo-vault-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Függőségek telepítése
        working-directory: photo-vault
        run: npm install --no-audit --no-fund
      - name: Android projekt létrehozása
        working-directory: photo-vault
        run: |
          npx cap add android
          npx cap sync android
      - name: Ikon és indítókép generálása
        working-directory: photo-vault
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#0b0f14' --iconBackgroundColorDark '#0b0f14' --splashBackgroundColor '#0b0f14' --splashBackgroundColorDark '#0b0f14'
      - name: Vissza gomb natív kezelő bemásolása
        working-directory: photo-vault
        run: |
          base=android/app/src/main
          mkdir -p "$base/java/hu/taky/photovault"
          cp native/java/MainActivity.java "$base/java/hu/taky/photovault/MainActivity.java"
      - name: Állandó aláíró kulcs
        run: mkdir -p ~/.android && cp photo-vault/debug.keystore ~/.android/debug.keystore
      - name: SDK útvonal
        working-directory: photo-vault/android
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
      - name: APK építése
        working-directory: photo-vault/android
        run: ./gradlew --no-daemon assembleDebug
      - name: APK átnevezése
        run: cp photo-vault/android/app/build/outputs/apk/debug/app-debug.apk PrivatSzef.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PrivatSzef-apk
          path: PrivatSzef.apk
      - name: Kiadás (csak a main ágon)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete photo-vault-apk --yes --cleanup-tag || true
          gh release create photo-vault-apk PrivatSzef.apk --target "${{ github.sha }}" \
            --title "Privát Széf – Android (APK)" \
            --notes "Töltsd le a PrivatSzef.apk fájlt, és telepítsd (ismeretlen forrásból telepítést engedélyezni kell). PIN-kóddal védett privát kép- és videótár: a + gombbal behozod a képeket/videókat a galériából, és a széfben tárolódnak – a telefon galériájában NEM látszanak. A videók lejátszhatók az appon belül. Egy elemet egy gombbal megoszthatsz/visszaküldhetsz a galériába (Discord, Messenger stb. is). Minden offline, az app privát tárolójában. Figyelem: ez elrejtés + PIN-védelem alkalmi használatra, nem titkosított banki szintű megoldás; az app adatainak törlésével a széf tartalma is elveszik, ezért fontos tartalomról készíts máshol is biztonsági mentést. Nagy videóknál a tárhely és a memória korlátos lehet."
