name: Tarkov Segéd APK (Android)

on:
  push:
    paths: ['tarkov-apk/**', 'web/tarkov/**', '.github/workflows/tarkov-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Webapp bemásolása az APK-ba (offline is induljon)
        run: |
          rm -rf tarkov-apk/www
          cp -r web/tarkov tarkov-apk/www
          rm -f tarkov-apk/www/sw.js

      - name: Függőségek telepítése
        working-directory: tarkov-apk
        run: npm install --no-audit --no-fund

      - name: Android projekt létrehozása
        working-directory: tarkov-apk
        run: |
          npx cap add android
          npx cap sync android

      - name: Ikon és indítókép generálása
        working-directory: tarkov-apk
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#1b1e18' --iconBackgroundColorDark '#1b1e18' --splashBackgroundColor '#11130f' --splashBackgroundColorDark '#11130f'

      - name: Vissza gomb kezelése (natív MainActivity)
        working-directory: tarkov-apk
        run: cp native/MainActivity.java android/app/src/main/java/hu/taky/tarkov/MainActivity.java

      - name: Állandó aláíró kulcs (hogy a frissítések törlés nélkül települjenek)
        run: mkdir -p ~/.android && cp apk/debug.keystore ~/.android/debug.keystore

      - name: SDK útvonal
        working-directory: tarkov-apk/android
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: APK építése
        working-directory: tarkov-apk/android
        run: ./gradlew --no-daemon assembleDebug

      - name: APK átnevezése
        run: cp tarkov-apk/android/app/build/outputs/apk/debug/app-debug.apk TarkovSeged.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TarkovSeged-apk
          path: TarkovSeged.apk

      # Release-ből telefonon is egy koppintással letölthető (az artifacthoz bejelentkezés kell, és ZIP-ben jön).
      - name: Kiadás (közvetlen letöltési link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete tarkov-apk --yes --cleanup-tag || true
          gh release create tarkov-apk TarkovSeged.apk --target "${{ github.sha }}" \
            --title "Tarkov Segéd – Android (APK)" \
            --notes "Töltsd le a TarkovSeged.apk fájlt a telefonodra, és telepítsd (az ismeretlen forrásból telepítést engedélyezni kell). Questkövetés, térkép a questcélokkal, raid terv, árak, lőszer, hideout."
