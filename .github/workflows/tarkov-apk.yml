name: Tarkov Kihívás APK (Android)

on:
  push:
    paths: ['tarkov-kihivas/**', '.github/workflows/tarkov-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Függőségek telepítése
        working-directory: tarkov-kihivas
        run: npm install --no-audit --no-fund

      - name: Android projekt létrehozása
        working-directory: tarkov-kihivas
        run: |
          npx cap add android
          npx cap sync android

      - name: Ikon és indítókép generálása
        working-directory: tarkov-kihivas
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#15170f' --iconBackgroundColorDark '#15170f' --splashBackgroundColor '#15170f' --splashBackgroundColorDark '#15170f'

      - name: Vissza gomb natív kezelő bemásolása
        working-directory: tarkov-kihivas
        run: |
          base=android/app/src/main
          mkdir -p "$base/java/hu/taky/tarkovkihivas"
          cp native/java/MainActivity.java "$base/java/hu/taky/tarkovkihivas/MainActivity.java"

      - name: Állandó aláíró kulcs (hogy a frissítések törlés nélkül települjenek)
        run: mkdir -p ~/.android && cp tarkov-kihivas/debug.keystore ~/.android/debug.keystore

      - name: SDK útvonal
        working-directory: tarkov-kihivas/android
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: APK építése
        working-directory: tarkov-kihivas/android
        run: ./gradlew --no-daemon assembleDebug

      - name: APK átnevezése
        run: cp tarkov-kihivas/android/app/build/outputs/apk/debug/app-debug.apk TarkovKihivas.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TarkovKihivas-apk
          path: TarkovKihivas.apk

      - name: Kiadás (csak a main ágon)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete tarkov-kihivas-apk --yes --cleanup-tag || true
          gh release create tarkov-kihivas-apk TarkovKihivas.apk --target "${{ github.sha }}" \
            --title "Tarkov Kihívás – Android (APK)" \
            --notes "Töltsd le a TarkovKihivas.apk fájlt, és telepítsd (ismeretlen forrásból telepítést engedélyezni kell). Escape from Tarkov kihívás-generátor 4 szinten (Könnyű, Nehéz, HC, Insane): pálya, cél, fegyver- és páncélmegkötés, extra szabályok, transit küldetések és secure/stash feltételek. Teljesen offline."
