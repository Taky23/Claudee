name: Anime Hub APK (Android)

on:
  push:
    paths: ['apk/**', '.github/workflows/anime-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Függőségek telepítése
        working-directory: apk
        run: npm install --no-audit --no-fund

      - name: Android projekt létrehozása
        working-directory: apk
        run: |
          npx cap add android
          npx cap sync android

      - name: Ikon és indítókép generálása
        working-directory: apk
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#0f0c1d' --iconBackgroundColorDark '#0f0c1d' --splashBackgroundColor '#0f0c1d' --splashBackgroundColorDark '#0f0c1d'

      - name: Widget natív fájlok bemásolása és AndroidManifest módosítása
        working-directory: apk
        run: |
          base=android/app/src/main
          mkdir -p "$base/java/hu/taky/animehub" "$base/res/layout" "$base/res/xml" "$base/res/drawable"
          cp native/java/AnimeWidget.java "$base/java/hu/taky/animehub/AnimeWidget.java"
          cp native/res/layout/anime_widget.xml "$base/res/layout/anime_widget.xml"
          cp native/res/xml/anime_widget_info.xml "$base/res/xml/anime_widget_info.xml"
          cp native/res/drawable/widget_bg.xml "$base/res/drawable/widget_bg.xml"
          node -e '
            const fs=require("fs");const p="android/app/src/main/AndroidManifest.xml";let m=fs.readFileSync(p,"utf8");
            if(!m.includes("AnimeWidget")){const rec=`\n        <receiver android:name=".AnimeWidget" android:exported="false">\n            <intent-filter>\n                <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />\n            </intent-filter>\n            <meta-data android:name="android.appwidget.provider" android:resource="@xml/anime_widget_info" />\n        </receiver>\n    `;m=m.replace("</application>",rec+"</application>");fs.writeFileSync(p,m);console.log("Manifest patchelve");}else{console.log("Mar patchelve");}
          '

      - name: Állandó aláíró kulcs (hogy a frissítések törlés nélkül települjenek)
        run: mkdir -p ~/.android && cp apk/debug.keystore ~/.android/debug.keystore

      - name: SDK útvonal
        working-directory: apk/android
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: APK építése
        working-directory: apk/android
        run: ./gradlew --no-daemon assembleDebug

      - name: APK átnevezése
        run: cp apk/android/app/build/outputs/apk/debug/app-debug.apk AnimeHub.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AnimeHub-apk
          path: AnimeHub.apk

      - name: Kiadás (csak a main ágon)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete anime-apk --yes --cleanup-tag || true
          gh release create anime-apk AnimeHub.apk --target "${{ github.sha }}" \
            --title "Anime Hub – Android (APK)" \
            --notes "Töltsd le az AnimeHub.apk fájlt a telefonodra, és telepítsd (az ismeretlen forrásból telepítést engedélyezni kell). Az app a mindig friss online Anime Hubot nyitja meg teljes képernyőn."
