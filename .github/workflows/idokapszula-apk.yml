name: Időkapszula APK (Android)

on:
  push:
    paths: ['idokapszula-apk/**', '.github/workflows/idokapszula-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Függőségek telepítése
        working-directory: idokapszula-apk
        run: npm install --no-audit --no-fund

      - name: Android projekt létrehozása
        working-directory: idokapszula-apk
        run: |
          npx cap add android
          npx cap sync android

      - name: Ikon és indítókép generálása
        working-directory: idokapszula-apk
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#0a0a18' --iconBackgroundColorDark '#0a0a18' --splashBackgroundColor '#0a0a18' --splashBackgroundColorDark '#0a0a18'

      - name: Vissza gomb natív kezelő bemásolása
        working-directory: idokapszula-apk
        run: |
          base=android/app/src/main
          mkdir -p "$base/java/hu/taky/idokapszula"
          cp native/java/MainActivity.java "$base/java/hu/taky/idokapszula/MainActivity.java"

      - name: Állandó aláíró kulcs (hogy a frissítések törlés nélkül települjenek)
        run: mkdir -p ~/.android && cp idokapszula-apk/debug.keystore ~/.android/debug.keystore

      - name: SDK útvonal
        working-directory: idokapszula-apk/android
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: APK építése
        working-directory: idokapszula-apk/android
        run: ./gradlew --no-daemon assembleDebug

      - name: APK átnevezése
        run: cp idokapszula-apk/android/app/build/outputs/apk/debug/app-debug.apk Idokapszula.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Idokapszula-apk
          path: Idokapszula.apk

      - name: Kiadás (csak a main ágon)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete idokapszula-apk --yes --cleanup-tag || true
          gh release create idokapszula-apk Idokapszula.apk --target "${{ github.sha }}" \
            --title "Időkapszula – Android (APK)" \
            --notes "Töltsd le az Idokapszula.apk fájlt a telefonodra, és telepítsd (az ismeretlen forrásból telepítést engedélyezni kell). Üzenet a jövőbeli énednek – minden az eszközödön marad."
