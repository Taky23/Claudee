name: Gamer Profil APK (Android)

on:
  push:
    paths: ['gamer-profile/**', '.github/workflows/gamer-profile-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Függőségek telepítése
        working-directory: gamer-profile
        run: npm install --no-audit --no-fund
      - name: Android projekt létrehozása
        working-directory: gamer-profile
        run: |
          npx cap add android
          npx cap sync android
      - name: Ikon és indítókép generálása
        working-directory: gamer-profile
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#0b0f1a' --iconBackgroundColorDark '#0b0f1a' --splashBackgroundColor '#0b0f1a' --splashBackgroundColorDark '#0b0f1a'
      - name: Vissza gomb natív kezelő bemásolása
        working-directory: gamer-profile
        run: |
          base=android/app/src/main
          mkdir -p "$base/java/hu/taky/gamerprofile"
          cp native/java/MainActivity.java "$base/java/hu/taky/gamerprofile/MainActivity.java"
      - name: Állandó aláíró kulcs
        run: mkdir -p ~/.android && cp gamer-profile/debug.keystore ~/.android/debug.keystore
      - name: SDK útvonal
        working-directory: gamer-profile/android
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
      - name: APK építése
        working-directory: gamer-profile/android
        run: ./gradlew --no-daemon assembleDebug
      - name: APK átnevezése
        run: cp gamer-profile/android/app/build/outputs/apk/debug/app-debug.apk GamerProfil.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GamerProfil-apk
          path: GamerProfil.apk
      - name: Kiadás (csak a main ágon)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete gamer-profile-apk --yes --cleanup-tag || true
          gh release create gamer-profile-apk GamerProfil.apk --target "${{ github.sha }}" \
            --title "Gamer Profil – Android (APK)" \
            --notes "Töltsd le a GamerProfil.apk fájlt, és telepítsd (ismeretlen forrásból telepítést engedélyezni kell). Látványos, személyre szabható gamer-profil: avatar és banner kép, név/tag/státusz/bio, szint + XP sáv, saját neon szín, statisztika-csempék, játékok borítóval és adatokkal, jelvények – mind szerkeszthető és a telefonon mentve. Egy gombbal elkészíted a profilt KÉPKÉNT és megoszthatod (Discord, Insta story stb.). Minden offline."
