name: GTA VI Companion APK (Android)

on:
  push:
    paths: ['gta6-companion/**', '.github/workflows/gta6-companion-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Függőségek telepítése
        working-directory: gta6-companion
        run: npm install --no-audit --no-fund
      - name: Android projekt létrehozása
        working-directory: gta6-companion
        run: |
          npx cap add android
          npx cap sync android
      - name: Ikon és indítókép generálása
        working-directory: gta6-companion
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#120a1f' --iconBackgroundColorDark '#120a1f' --splashBackgroundColor '#120a1f' --splashBackgroundColorDark '#120a1f'
      - name: Vissza gomb natív kezelő bemásolása
        working-directory: gta6-companion
        run: |
          base=android/app/src/main
          mkdir -p "$base/java/hu/taky/gta6companion"
          cp native/java/MainActivity.java "$base/java/hu/taky/gta6companion/MainActivity.java"
      - name: Állandó aláíró kulcs
        run: mkdir -p ~/.android && cp gta6-companion/debug.keystore ~/.android/debug.keystore
      - name: SDK útvonal
        working-directory: gta6-companion/android
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
      - name: APK építése
        working-directory: gta6-companion/android
        run: ./gradlew --no-daemon assembleDebug
      - name: APK átnevezése
        run: cp gta6-companion/android/app/build/outputs/apk/debug/app-debug.apk GTA6-Companion.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GTA6-Companion-apk
          path: GTA6-Companion.apk
      - name: Kiadás (csak a main ágon)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete gta6-companion-apk --yes --cleanup-tag || true
          gh release create gta6-companion-apk GTA6-Companion.apk --target "${{ github.sha }}" \
            --title "GTA VI Companion – Android (APK)" \
            --notes "Töltsd le a GTA6-Companion.apk fájlt, és telepítsd (ismeretlen forrásból telepítést engedélyezni kell). GTA VI társalkalmazás: élő visszaszámláló a megjelenésig (2026. november 19.), interaktív Leonida-térkép a trailerekből ismert régiókkal, megerősített infók és felkészülési tippek. Teljesen OFFLINE működik, nem kell hozzá internet."
