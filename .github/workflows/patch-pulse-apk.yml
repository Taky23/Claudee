name: Patch Pulse APK (Android)

on:
  push:
    paths: ['patch-pulse/**', '.github/workflows/patch-pulse-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Függőségek telepítése
        working-directory: patch-pulse
        run: npm install --no-audit --no-fund
      - name: Android projekt létrehozása
        working-directory: patch-pulse
        run: |
          npx cap add android
          npx cap sync android
      - name: Ikon és indítókép generálása
        working-directory: patch-pulse
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#0b0f14' --iconBackgroundColorDark '#0b0f14' --splashBackgroundColor '#0b0f14' --splashBackgroundColorDark '#0b0f14'
      - name: Vissza gomb natív kezelő bemásolása
        working-directory: patch-pulse
        run: |
          base=android/app/src/main
          mkdir -p "$base/java/hu/taky/patchpulse"
          cp native/java/MainActivity.java "$base/java/hu/taky/patchpulse/MainActivity.java"
      - name: Állandó aláíró kulcs (hogy a frissítések törlés nélkül települjenek)
        run: mkdir -p ~/.android && cp patch-pulse/debug.keystore ~/.android/debug.keystore
      - name: SDK útvonal
        working-directory: patch-pulse/android
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
      - name: APK építése
        working-directory: patch-pulse/android
        run: ./gradlew --no-daemon assembleDebug
      - name: APK átnevezése
        run: cp patch-pulse/android/app/build/outputs/apk/debug/app-debug.apk PatchPulse.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PatchPulse-apk
          path: PatchPulse.apk
      - name: Kiadás (csak a main ágon)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete patch-pulse-apk --yes --cleanup-tag || true
          gh release create patch-pulse-apk PatchPulse.apk --target "${{ github.sha }}" \
            --title "Patch Pulse – Android (APK)" \
            --notes "Töltsd le a PatchPulse.apk fájlt, és telepítsd (ismeretlen forrásból telepítést engedélyezni kell). Steam-játékok frissítés- és patch note-figyelője: keresd meg a játékot (Tarkov, Arena Breakout, DayZ, bármi), és követed. Patch note-ok, karbantartások, eventek időrendben, ÚJ jelzéssel és helyi értesítéssel."
