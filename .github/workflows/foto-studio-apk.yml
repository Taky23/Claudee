name: Foto Stúdió APK (Android)

on:
  push:
    paths: ['foto-studio/**', '.github/workflows/foto-studio-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Függőségek telepítése
        working-directory: foto-studio
        run: npm install --no-audit --no-fund
      - name: Android projekt létrehozása
        working-directory: foto-studio
        run: |
          npx cap add android
          npx cap sync android
      - name: Ikon és indítókép generálása
        working-directory: foto-studio
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#0c111a' --iconBackgroundColorDark '#0c111a' --splashBackgroundColor '#0c111a' --splashBackgroundColorDark '#0c111a'
      - name: Vissza gomb natív kezelő bemásolása
        working-directory: foto-studio
        run: |
          base=android/app/src/main
          mkdir -p "$base/java/hu/taky/fotostudio"
          cp native/java/MainActivity.java "$base/java/hu/taky/fotostudio/MainActivity.java"
      - name: Állandó aláíró kulcs
        run: mkdir -p ~/.android && cp foto-studio/debug.keystore ~/.android/debug.keystore
      - name: SDK útvonal
        working-directory: foto-studio/android
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
      - name: APK építése
        working-directory: foto-studio/android
        run: ./gradlew --no-daemon assembleDebug
      - name: APK átnevezése
        run: cp foto-studio/android/app/build/outputs/apk/debug/app-debug.apk FotoStudio.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FotoStudio-apk
          path: FotoStudio.apk
      - name: Kiadás (csak a main ágon)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete foto-studio-apk --yes --cleanup-tag || true
          gh release create foto-studio-apk FotoStudio.apk --target "${{ github.sha }}" \
            --title "Foto Stúdió – Android (APK)" \
            --notes "Töltsd le a FotoStudio.apk fájlt, és telepítsd (ismeretlen forrásból telepítést engedélyezni kell). Két funkció: (1) a fotón lévő SZEMÉLY kiemelése AI-val – kivágás átlátszó háttérre, háttér elmosása vagy háttérszín; (2) több fotó KÖTEGELT méretezése gyorsan (IG 1:1/4:5/9:16, max méret, vagy %). Minden a telefonon fut, OFFLINE (a szegmentáló modell be van építve). A kész képeket egy gombbal megoszthatod vagy galériába mentheted."
