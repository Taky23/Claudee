name: Manó kalandja APK (Android)

on:
  push:
    paths: ['ugro-apk/**', '.github/workflows/ugro-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Függőségek telepítése
        working-directory: ugro-apk
        run: npm install --no-audit --no-fund

      - name: Android projekt létrehozása
        working-directory: ugro-apk
        run: |
          npx cap add android
          npx cap sync android

      - name: Ikon és indítókép generálása
        working-directory: ugro-apk
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#5c94fc' --iconBackgroundColorDark '#5c94fc' --splashBackgroundColor '#5c94fc' --splashBackgroundColorDark '#5c94fc'

      - name: Vissza gomb natív kezelő bemásolása
        working-directory: ugro-apk
        run: |
          base=android/app/src/main
          mkdir -p "$base/java/hu/taky/ugro"
          cp native/java/MainActivity.java "$base/java/hu/taky/ugro/MainActivity.java"

      - name: Állandó aláíró kulcs (hogy a frissítések törlés nélkül települjenek)
        run: mkdir -p ~/.android && cp ugro-apk/debug.keystore ~/.android/debug.keystore

      - name: SDK útvonal
        working-directory: ugro-apk/android
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: APK építése
        working-directory: ugro-apk/android
        run: ./gradlew --no-daemon assembleDebug

      - name: APK átnevezése
        run: cp ugro-apk/android/app/build/outputs/apk/debug/app-debug.apk Mano-kalandja.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Mano-kalandja-apk
          path: Mano-kalandja.apk

      - name: Kiadás (csak a main ágon)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ugro-apk --yes --cleanup-tag || true
          gh release create ugro-apk Mano-kalandja.apk --target "${{ github.sha }}" \
            --title "Manó kalandja – Android (APK)" \
            --notes "Töltsd le a Mano-kalandja.apk fájlt a telefonodra, és telepítsd (az ismeretlen forrásból telepítést engedélyezni kell). Egyszerű 2D-s platformer 8 pályával és power-upokkal – minden az eszközödön."
