name: Képműhely APK (Android)

on:
  push:
    paths: ['kepmuhely-apk/**', '.github/workflows/kepmuhely-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Függőségek telepítése
        working-directory: kepmuhely-apk
        run: npm install --no-audit --no-fund

      - name: Android projekt létrehozása
        working-directory: kepmuhely-apk
        run: |
          npx cap add android
          npx cap sync android

      - name: Ikon és indítókép generálása
        working-directory: kepmuhely-apk
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#0e1116' --iconBackgroundColorDark '#0e1116' --splashBackgroundColor '#0e1116' --splashBackgroundColorDark '#0e1116'

      - name: Vissza gomb natív kezelő bemásolása
        working-directory: kepmuhely-apk
        run: |
          base=android/app/src/main
          mkdir -p "$base/java/hu/taky/kepmuhely"
          cp native/java/MainActivity.java "$base/java/hu/taky/kepmuhely/MainActivity.java"

      - name: Állandó aláíró kulcs (hogy a frissítések törlés nélkül települjenek)
        run: mkdir -p ~/.android && cp kepmuhely-apk/debug.keystore ~/.android/debug.keystore

      - name: SDK útvonal
        working-directory: kepmuhely-apk/android
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: APK építése
        working-directory: kepmuhely-apk/android
        run: ./gradlew --no-daemon assembleDebug

      - name: APK átnevezése
        run: cp kepmuhely-apk/android/app/build/outputs/apk/debug/app-debug.apk Kepmuhely.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Kepmuhely-apk
          path: Kepmuhely.apk

      - name: Kiadás (csak a main ágon)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete kepmuhely-apk --yes --cleanup-tag || true
          gh release create kepmuhely-apk Kepmuhely.apk --target "${{ github.sha }}" \
            --title "Képműhely – Android (APK)" \
            --notes "Töltsd le a Kepmuhely.apk fájlt a telefonodra, és telepítsd (az ismeretlen forrásból telepítést engedélyezni kell). Tömeges képfeldolgozó: metaadat-törlés, duplikátum-keresés, workflow-receptek feltételekkel, export – minden a telefonodon történik."
