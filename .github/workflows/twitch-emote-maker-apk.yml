name: Twitch Emote Maker APK (Android)

on:
  push:
    paths: ['twitch-emote-maker/**', '.github/workflows/twitch-emote-maker-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Függőségek telepítése
        working-directory: twitch-emote-maker
        run: npm install --no-audit --no-fund
      - name: Android projekt létrehozása
        working-directory: twitch-emote-maker
        run: |
          npx cap add android
          npx cap sync android
      - name: Ikon és indítókép generálása
        working-directory: twitch-emote-maker
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#0e0b1a' --iconBackgroundColorDark '#0e0b1a' --splashBackgroundColor '#0e0b1a' --splashBackgroundColorDark '#0e0b1a'
      - name: Vissza gomb natív kezelő bemásolása
        working-directory: twitch-emote-maker
        run: |
          base=android/app/src/main
          mkdir -p "$base/java/hu/taky/twitchemotemaker"
          cp native/java/MainActivity.java "$base/java/hu/taky/twitchemotemaker/MainActivity.java"
      - name: Állandó aláíró kulcs
        run: mkdir -p ~/.android && cp twitch-emote-maker/debug.keystore ~/.android/debug.keystore
      - name: SDK útvonal
        working-directory: twitch-emote-maker/android
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
      - name: APK építése
        working-directory: twitch-emote-maker/android
        run: ./gradlew --no-daemon assembleDebug
      - name: APK átnevezése
        run: cp twitch-emote-maker/android/app/build/outputs/apk/debug/app-debug.apk TwitchEmoteMaker.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TwitchEmoteMaker-apk
          path: TwitchEmoteMaker.apk
      - name: Kiadás (csak a main ágon)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete twitch-emote-maker-apk --yes --cleanup-tag || true
          gh release create twitch-emote-maker-apk TwitchEmoteMaker.apk --target "${{ github.sha }}" \
            --title "Twitch Emote Maker – Android (APK)" \
            --notes "Töltsd le a TwitchEmoteMaker.apk fájlt, és telepítsd (ismeretlen forrásból telepítést engedélyezni kell). Egyedi Twitch emote-ok készítése: betöltesz egy képet, levágod négyzetre, eltávolítod a hátteret, kontúrt adsz hozzá, és exportálod a pontos Twitch méretekben (112/56/28 px, átlátszó PNG) – sub-badge méretek is (72/36/18). Élő előnézet sötét és világos chaten. Teljesen OFFLINE. A kész PNG-ket a Twitch Creator Dashboardon töltöd fel."
