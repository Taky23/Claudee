name: Nyugi APK (Android)

on:
  push:
    paths: ['nyugi-apk/**', '.github/workflows/nyugi-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Függőségek telepítése
        working-directory: nyugi-apk
        run: npm install --no-audit --no-fund

      - name: Android projekt létrehozása
        working-directory: nyugi-apk
        run: |
          npx cap add android
          npx cap sync android

      - name: Ikon és indítókép generálása
        working-directory: nyugi-apk
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#0b1416' --iconBackgroundColorDark '#0b1416' --splashBackgroundColor '#0b1416' --splashBackgroundColorDark '#0b1416'

      - name: Vissza gomb natív kezelő bemásolása
        working-directory: nyugi-apk
        run: |
          base=android/app/src/main
          mkdir -p "$base/java/hu/taky/nyugi"
          cp native/java/MainActivity.java "$base/java/hu/taky/nyugi/MainActivity.java"

      - name: Állandó aláíró kulcs (hogy a frissítések törlés nélkül települjenek)
        run: mkdir -p ~/.android && cp nyugi-apk/debug.keystore ~/.android/debug.keystore

      - name: SDK útvonal
        working-directory: nyugi-apk/android
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: APK építése
        working-directory: nyugi-apk/android
        run: ./gradlew --no-daemon assembleDebug

      - name: APK átnevezése
        run: cp nyugi-apk/android/app/build/outputs/apk/debug/app-debug.apk Nyugi.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Nyugi-apk
          path: Nyugi.apk

      - name: Kiadás (csak a main ágon)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nyugi-apk --yes --cleanup-tag || true
          gh release create nyugi-apk Nyugi.apk --target "${{ github.sha }}" \
            --title "Nyugi – Android (APK)" \
            --notes "Töltsd le a Nyugi.apk fájlt a telefonodra, és telepítsd (az ismeretlen forrásból telepítést engedélyezni kell). Megnyugtató segítség dühös pillanatokra: légzés, földelés, hangok és kedves üzenetek – minden az eszközödön."
