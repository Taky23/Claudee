name: Világ Rejtélyei APK (Android)

on:
  push:
    paths: ['felfedezo/**', '.github/workflows/felfedezo-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Függőségek telepítése
        working-directory: felfedezo
        run: npm install --no-audit --no-fund
      - name: Android projekt létrehozása
        working-directory: felfedezo
        run: |
          npx cap add android
          npx cap sync android
      - name: Ikon és indítókép generálása
        working-directory: felfedezo
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#0a0f1a' --iconBackgroundColorDark '#0a0f1a' --splashBackgroundColor '#0a0f1a' --splashBackgroundColorDark '#0a0f1a'
      - name: Vissza gomb natív kezelő bemásolása
        working-directory: felfedezo
        run: |
          base=android/app/src/main
          mkdir -p "$base/java/hu/taky/felfedezo"
          cp native/java/MainActivity.java "$base/java/hu/taky/felfedezo/MainActivity.java"
      - name: Állandó aláíró kulcs (hogy a frissítések törlés nélkül települjenek)
        run: mkdir -p ~/.android && cp felfedezo/debug.keystore ~/.android/debug.keystore
      - name: SDK útvonal
        working-directory: felfedezo/android
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
      - name: APK építése
        working-directory: felfedezo/android
        run: ./gradlew --no-daemon assembleDebug
      - name: APK átnevezése
        run: cp felfedezo/android/app/build/outputs/apk/debug/app-debug.apk VilagRejtelyei.apk
      - uses: actions/upload-artifact@v4
        with:
          name: VilagRejtelyei-apk
          path: VilagRejtelyei.apk
      - name: Kiadás (csak a main ágon)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete felfedezo-apk --yes --cleanup-tag || true
          gh release create felfedezo-apk VilagRejtelyei.apk --target "${{ github.sha }}" \
            --title "Világ Rejtélyei – Android (APK)" \
            --notes "Töltsd le a VilagRejtelyei.apk fájlt, és telepítsd (ismeretlen forrásból telepítést engedélyezni kell). Interaktív térkép a világ rejtélyes és különleges helyeiről: elhagyatott városok, ősi romok, megmagyarázhatatlan jelenségek. Leírás és fotó a Wikipédiából, véletlen felfedezés, kedvencek és előzmények. Magyar nyelven."
